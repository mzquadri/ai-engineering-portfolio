<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1309" viewBox="0 0 1920 1309" role="img" aria-label="What actually goes wrong, and what happens next" font-family='Inter, "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif'><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16202C" stroke-width="1" stroke-opacity="0.5"/></pattern><pattern id="grid-coarse" width="200" height="200" patternUnits="userSpaceOnUse"><path d="M200 0H0V200" fill="none" stroke="#16202C" stroke-width="1.4" stroke-opacity="0.9"/></pattern><radialGradient id="vignette" cx="50%" cy="120%" r="120%"><stop offset="0%" stop-color="rgba(0,0,0,0.340)"/><stop offset="55%" stop-color="rgba(0,0,0,0.100)"/><stop offset="100%" stop-color="rgba(0,0,0,0.000)"/></radialGradient><radialGradient id="aurora-a" cx="8%" cy="-6%" r="62%"><stop offset="0%" stop-color="rgba(96,165,250,0.130)"/><stop offset="100%" stop-color="rgba(96,165,250,0.000)"/></radialGradient><radialGradient id="aurora-b" cx="96%" cy="4%" r="58%"><stop offset="0%" stop-color="rgba(52,211,153,0.100)"/><stop offset="100%" stop-color="rgba(52,211,153,0.000)"/></radialGradient><linearGradient id="topsheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="rgba(96,165,250,0.000)"/><stop offset="22%" stop-color="rgba(96,165,250,0.450)"/><stop offset="52%" stop-color="rgba(52,211,153,0.400)"/><stop offset="78%" stop-color="rgba(129,140,248,0.350)"/><stop offset="100%" stop-color="rgba(129,140,248,0.000)"/></linearGradient></defs><g data-name="background"><rect width="1920" height="1309" fill="#070A0F"/><rect width="1920" height="1309" fill="url(#grid-coarse)" opacity="0.5"/><rect width="1920" height="1309" fill="url(#grid)" opacity="0.38"/><rect width="1920" height="1309" fill="url(#aurora-a)"/><rect width="1920" height="1309" fill="url(#aurora-b)"/><rect width="1920" height="1309" fill="url(#vignette)"/><rect width="1920" height="2" fill="url(#topsheen)"/></g><g data-name="header"><text x="56.0" y="68.0" font-size="12.0" font-weight="600" fill="#60A5FA" letter-spacing="1.4">FAILURE AND RECOVERY</text><text x="56.0" y="109.0" font-size="34.0" font-weight="600" fill="#E8EEF6" letter-spacing="-0.4">What actually goes wrong, and what happens next</text><text x="56.0" y="140.0" font-size="17.0" font-weight="400" fill="#9FB0C3">Every row is a failure the repositories document, with the recovery that exists — or the honest statement that none does.</text><line x1="56" y1="169.46" x2="1864" y2="169.46" stroke="#1C2736" stroke-width="1"/></g><g data-name="byline"><text x="1864.0" y="70.0" font-size="12.0" font-weight="500" fill="#9FB0C3" letter-spacing="0.3" text-anchor="end">Mohd Zamin Quadri</text><text x="1864.0" y="88.0" font-size="11.5" font-weight="400" fill="#667B91" text-anchor="end">AI Engineer · BP-ITCS</text></g><g data-name="matrix:failures"><rect x="56" y="229.46" width="1608" height="50" rx="6" fill="rgba(232,238,246,0.040)"/><text x="68.0" y="268.5" font-size="12.0" font-weight="600" fill="#667B91" letter-spacing="1.4">FAILURE</text><text x="398.0" y="268.5" font-size="12.0" font-weight="600" fill="#667B91" letter-spacing="1.4">WHERE</text><text x="698.0" y="268.5" font-size="12.0" font-weight="600" fill="#667B91" letter-spacing="1.4">IMMEDIATE EFFECT</text><text x="1098.0" y="268.5" font-size="12.0" font-weight="600" fill="#667B91" letter-spacing="1.4">RECOVERY</text><text x="1518.0" y="268.5" font-size="12.0" font-weight="600" fill="#667B91" letter-spacing="1.4">CLASS</text><text x="68.0" y="301.5" font-size="11.5" font-weight="400" fill="rgba(52,211,153,0.950)">Source download fails</text><text x="398.0" y="301.5" font-size="11.5" font-weight="400" fill="#9FB0C3">Health service cannot reach the publisher, or CELLAR</text><text x="398.0" y="314.5" font-size="11.5" font-weight="400" fill="#9FB0C3">negotiation fails</text><text x="698.0" y="301.5" font-size="11.5" font-weight="400" fill="#9FB0C3">Nothing published, nothing written</text><text x="1098.0" y="301.5" font-size="11.5" font-weight="400" fill="#9FB0C3">Operator retries. Re-ingest is idempotent at this stage.</text><text x="1518.0" y="301.5" font-size="11.5" font-weight="400" fill="#9FB0C3">recovered</text><rect x="56" y="336.46000000000004" width="1608" height="54" rx="4" fill="rgba(232,238,246,0.022)"/><text x="68.0" y="355.5" font-size="11.5" font-weight="400" fill="rgba(52,211,153,0.950)">MinIO upload fails on a download-mode capture</text><text x="398.0" y="355.5" font-size="11.5" font-weight="400" fill="#9FB0C3">originUrl path, where MinIO is mandatory</text><text x="698.0" y="355.5" font-size="11.5" font-weight="400" fill="#9FB0C3">502; nothing published</text><text x="1098.0" y="355.5" font-size="11.5" font-weight="400" fill="#9FB0C3">Operator retries</text><text x="1518.0" y="355.5" font-size="11.5" font-weight="400" fill="#9FB0C3">recovered</text><text x="68.0" y="409.5" font-size="11.5" font-weight="400" fill="rgba(240,180,41,0.950)">MinIO upload fails on an upload-mode capture</text><text x="398.0" y="409.5" font-size="11.5" font-weight="400" fill="#9FB0C3">file path, where MinIO is best-effort</text><text x="698.0" y="409.5" font-size="11.5" font-weight="400" fill="#9FB0C3">Tolerated: publication continues with the inline copy, and the event has</text><text x="698.0" y="422.5" font-size="11.5" font-weight="400" fill="#9FB0C3">no MinIO url</text><text x="1098.0" y="409.5" font-size="11.5" font-weight="400" fill="#9FB0C3">Degraded but consistent</text><text x="1518.0" y="409.5" font-size="11.5" font-weight="400" fill="#9FB0C3">degraded</text><rect x="56" y="444.46000000000004" width="1608" height="54" rx="4" fill="rgba(232,238,246,0.022)"/><text x="68.0" y="463.5" font-size="11.5" font-weight="400" fill="rgba(248,113,113,0.950)">Kafka ack times out</text><text x="398.0" y="463.5" font-size="11.5" font-weight="400" fill="#9FB0C3">Producer cannot confirm publication</text><text x="698.0" y="463.5" font-size="11.5" font-weight="400" fill="#9FB0C3">503 — and the send may already have reached the broker</text><text x="1098.0" y="463.5" font-size="11.5" font-weight="400" fill="#9FB0C3">A retry mints a new eventId, so the same bytes land under a second prefix.</text><text x="1098.0" y="476.5" font-size="11.5" font-weight="400" fill="#9FB0C3">No compensation exists.</text><text x="1518.0" y="463.5" font-size="11.5" font-weight="400" fill="#9FB0C3">accepted</text><text x="68.0" y="517.5" font-size="11.5" font-weight="400" fill="rgba(248,113,113,0.950)">Orphaned capture</text><text x="398.0" y="517.5" font-size="11.5" font-weight="400" fill="#9FB0C3">MinIO is written before Kafka; publication then fails</text><text x="698.0" y="517.5" font-size="11.5" font-weight="400" fill="#9FB0C3">An object exists that no event references</text><text x="1098.0" y="517.5" font-size="11.5" font-weight="400" fill="#9FB0C3">Nothing removes it. Recorded as a known consequence.</text><text x="1518.0" y="517.5" font-size="11.5" font-weight="400" fill="#9FB0C3">accepted</text><rect x="56" y="552.46" width="1608" height="54" rx="4" fill="rgba(232,238,246,0.022)"/><text x="68.0" y="571.5" font-size="11.5" font-weight="400" fill="rgba(96,165,250,0.950)">Pre-flight detects unknown structure</text><text x="398.0" y="571.5" font-size="11.5" font-weight="400" fill="#9FB0C3">A law whose markup the model does not represent</text><text x="698.0" y="571.5" font-size="11.5" font-weight="400" fill="#9FB0C3">BLOCKED before ingestion</text><text x="1098.0" y="571.5" font-size="11.5" font-weight="400" fill="#9FB0C3">Stop and report the gap. Never weaken the gate or special-case the law.</text><text x="1518.0" y="571.5" font-size="11.5" font-weight="400" fill="#9FB0C3">by design</text><text x="68.0" y="625.5" font-size="11.5" font-weight="400" fill="rgba(96,165,250,0.950)">Embedding would be truncated</text><text x="398.0" y="625.5" font-size="11.5" font-weight="400" fill="#9FB0C3">A chunk exceeds the model's 8192-token window</text><text x="698.0" y="625.5" font-size="11.5" font-weight="400" fill="#9FB0C3">The whole law is refused rather than storing a vector that misrepresents</text><text x="698.0" y="638.5" font-size="11.5" font-weight="400" fill="#9FB0C3">its text</text><text x="1098.0" y="625.5" font-size="11.5" font-weight="400" fill="#9FB0C3">Fix the chunking, then replay</text><text x="1518.0" y="625.5" font-size="11.5" font-weight="400" fill="#9FB0C3">by design</text><rect x="56" y="660.46" width="1608" height="54" rx="4" fill="rgba(232,238,246,0.022)"/><text x="68.0" y="679.5" font-size="11.5" font-weight="400" fill="rgba(52,211,153,0.950)">Qdrant converges, Neo4j fails</text><text x="398.0" y="679.5" font-size="11.5" font-weight="400" fill="#9FB0C3">Partial projection</text><text x="698.0" y="679.5" font-size="11.5" font-weight="400" fill="#9FB0C3">No law.embedded, offset uncommitted, consume loop ends</text><text x="1098.0" y="679.5" font-size="11.5" font-weight="400" fill="#9FB0C3">Redelivery re-runs both stores from a fresh snapshot and converges</text><text x="1098.0" y="692.5" font-size="11.5" font-weight="400" fill="#9FB0C3">identically</text><text x="1518.0" y="679.5" font-size="11.5" font-weight="400" fill="#9FB0C3">recovered</text><text x="68.0" y="733.5" font-size="11.5" font-weight="400" fill="rgba(52,211,153,0.950)">Crash between publish and commit</text><text x="398.0" y="733.5" font-size="11.5" font-weight="400" fill="#9FB0C3">Offset not yet committed</text><text x="698.0" y="733.5" font-size="11.5" font-weight="400" fill="#9FB0C3">law.embedded may be published twice</text><text x="1098.0" y="733.5" font-size="11.5" font-weight="400" fill="#9FB0C3">The unique index on capture_id absorbs the duplicate</text><text x="1518.0" y="733.5" font-size="11.5" font-weight="400" fill="#9FB0C3">recovered</text><rect x="56" y="768.46" width="1608" height="54" rx="4" fill="rgba(232,238,246,0.022)"/><text x="68.0" y="787.5" font-size="11.5" font-weight="400" fill="rgba(96,165,250,0.950)">Stores disagree at rest</text><text x="398.0" y="787.5" font-size="11.5" font-weight="400" fill="#9FB0C3">Drift between canonical and derived state</text><text x="698.0" y="787.5" font-size="11.5" font-weight="400" fill="#9FB0C3">Reconciliation reports DRIFT_DETECTED</text><text x="1098.0" y="787.5" font-size="11.5" font-weight="400" fill="#9FB0C3">Operator decides: re-ingest, or investigate. Nothing self-heals.</text><text x="1518.0" y="787.5" font-size="11.5" font-weight="400" fill="#9FB0C3">operator</text><text x="68.0" y="841.5" font-size="11.5" font-weight="400" fill="rgba(52,211,153,0.950)">A store is unreachable during a check</text><text x="398.0" y="841.5" font-size="11.5" font-weight="400" fill="#9FB0C3">Qdrant or Neo4j down</text><text x="698.0" y="841.5" font-size="11.5" font-weight="400" fill="#9FB0C3">CHECK_UNAVAILABLE — a first-class answer, distinct from</text><text x="698.0" y="854.5" font-size="11.5" font-weight="400" fill="#9FB0C3">disagreement</text><text x="1098.0" y="841.5" font-size="11.5" font-weight="400" fill="#9FB0C3">Retry the sweep</text><text x="1518.0" y="841.5" font-size="11.5" font-weight="400" fill="#9FB0C3">recovered</text><rect x="56" y="876.46" width="1608" height="54" rx="4" fill="rgba(232,238,246,0.022)"/><text x="68.0" y="895.5" font-size="11.5" font-weight="400" fill="rgba(96,165,250,0.950)">Publisher has moved on</text><text x="398.0" y="895.5" font-size="11.5" font-weight="400" fill="#9FB0C3">The source file changed since capture</text><text x="698.0" y="895.5" font-size="11.5" font-weight="400" fill="#9FB0C3">currency.source_state reports</text><text x="698.0" y="908.5" font-size="11.5" font-weight="400" fill="#9FB0C3">SOURCE_CHANGED_REINGEST_REQUIRED</text><text x="1098.0" y="895.5" font-size="11.5" font-weight="400" fill="#9FB0C3">Operator re-ingests. The old generation stays queryable until the new one</text><text x="1098.0" y="908.5" font-size="11.5" font-weight="400" fill="#9FB0C3">completes.</text><text x="1518.0" y="895.5" font-size="11.5" font-weight="400" fill="#9FB0C3">operator</text><text x="68.0" y="949.5" font-size="11.5" font-weight="400" fill="rgba(96,165,250,0.950)">Ruleset changed since a generation was stored</text><text x="398.0" y="949.5" font-size="11.5" font-weight="400" fill="#9FB0C3">A byte changed in the parser, extractor or registry</text><text x="698.0" y="949.5" font-size="11.5" font-weight="400" fill="#9FB0C3">The recorded digest no longer matches the installed one; the corpus</text><text x="698.0" y="962.5" font-size="11.5" font-weight="400" fill="#9FB0C3">baseline fails and no law gets a verdict</text><text x="1098.0" y="949.5" font-size="11.5" font-weight="400" fill="#9FB0C3">Re-extract from the held capture. If output is unchanged, revalidate; if it</text><text x="1098.0" y="962.5" font-size="11.5" font-weight="400" fill="#9FB0C3">differs, replay.</text><text x="1518.0" y="949.5" font-size="11.5" font-weight="400" fill="#9FB0C3">by design</text><rect x="56" y="984.46" width="1608" height="54" rx="4" fill="rgba(232,238,246,0.022)"/><text x="68.0" y="1003.5" font-size="11.5" font-weight="400" fill="rgba(52,211,153,0.950)">Withdrawal half-completes</text><text x="398.0" y="1003.5" font-size="11.5" font-weight="400" fill="#9FB0C3">Canonical state committed, projection cleanup failed</text><text x="698.0" y="1003.5" font-size="11.5" font-weight="400" fill="#9FB0C3">RECONCILIATION_REQUIRED 409 — the law is withdrawn and not</text><text x="698.0" y="1016.5" font-size="11.5" font-weight="400" fill="#9FB0C3">served</text><text x="1098.0" y="1003.5" font-size="11.5" font-weight="400" fill="#9FB0C3">Retry re-runs cleanup. Evidence is never touched by any step.</text><text x="1518.0" y="1003.5" font-size="11.5" font-weight="400" fill="#9FB0C3">recovered</text><text x="68.0" y="1057.5" font-size="11.5" font-weight="400" fill="rgba(248,113,113,0.950)">A law is permanently unprocessable</text><text x="398.0" y="1057.5" font-size="11.5" font-weight="400" fill="#9FB0C3">Parse or gate failure that redelivery cannot fix</text><text x="698.0" y="1057.5" font-size="11.5" font-weight="400" fill="#9FB0C3">No dead-letter topic exists. It is redelivered for ever and blocks its</text><text x="698.0" y="1070.5" font-size="11.5" font-weight="400" fill="#9FB0C3">partition.</text><text x="1098.0" y="1057.5" font-size="11.5" font-weight="400" fill="#9FB0C3">Manual intervention. This is the clearest gap in the pipeline.</text><text x="1518.0" y="1057.5" font-size="11.5" font-weight="400" fill="#9FB0C3">gap</text><line x1="56" y1="1095.46" x2="1664" y2="1095.46" stroke="#1C2736" stroke-width="1"/></g><g data-name="note"><rect x="56" y="1143.46" width="2.5" height="63.5" rx="1.2" fill="rgba(248,113,113,0.850)"/><text x="70.0" y="1155.5" font-size="12.0" font-weight="600" fill="rgba(248,113,113,0.950)" letter-spacing="1.4">ACCEPTED, NOT UNNOTICED</text><text x="70.0" y="1175.5" font-size="12.5" font-weight="400" fill="#9FB0C3">Three of these are labelled accepted and one is labelled gap. That is the point of the diagram: a pipeline with no dead-letter topic, no bounded retry and no automatic repair is a deliberate position for a legal corpus — an automatic self-heal that silently re-derives knowledge is, after the fact, indistinguishable from</text><text x="70.0" y="1193.2" font-size="12.5" font-weight="400" fill="#9FB0C3">one that silently corrupted it — but it is a position with a real cost, and the cost is that one bad law can stall a partition until a human intervenes.</text></g><g data-name="legend"><text x="56.0" y="1247.0" font-size="12.0" font-weight="600" fill="#667B91" letter-spacing="1.4">ROLE</text><circle cx="115" cy="1242.96" r="4.6" fill="#F0B429" opacity="0.92"/><text x="125.0" y="1247.0" font-size="12.0" font-weight="500" fill="#9FB0C3" letter-spacing="0.3">Persistence</text><circle cx="223.97039999999998" cy="1242.96" r="4.6" fill="#34D399" opacity="0.92"/><text x="234.0" y="1247.0" font-size="12.0" font-weight="500" fill="#9FB0C3" letter-spacing="0.3">Verification / trust</text><circle cx="372.19424" cy="1242.96" r="4.6" fill="#60A5FA" opacity="0.92"/><text x="382.2" y="1247.0" font-size="12.0" font-weight="500" fill="#9FB0C3" letter-spacing="0.3">Operator / API</text><circle cx="497.60895999999997" cy="1242.96" r="4.6" fill="#F87171" opacity="0.92"/><text x="507.6" y="1247.0" font-size="12.0" font-weight="500" fill="#9FB0C3" letter-spacing="0.3">Failure path</text></g></svg>