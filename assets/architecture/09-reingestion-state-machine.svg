<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="911" viewBox="0 0 1920 911" role="img" aria-label="Re-ingestion, and what it does to system state" font-family='Inter, "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif'><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16202C" stroke-width="1" stroke-opacity="0.5"/></pattern><pattern id="grid-coarse" width="200" height="200" patternUnits="userSpaceOnUse"><path d="M200 0H0V200" fill="none" stroke="#16202C" stroke-width="1.4" stroke-opacity="0.9"/></pattern><radialGradient id="vignette" cx="50%" cy="120%" r="120%"><stop offset="0%" stop-color="rgba(0,0,0,0.340)"/><stop offset="55%" stop-color="rgba(0,0,0,0.100)"/><stop offset="100%" stop-color="rgba(0,0,0,0.000)"/></radialGradient><radialGradient id="aurora-a" cx="8%" cy="-6%" r="62%"><stop offset="0%" stop-color="rgba(96,165,250,0.130)"/><stop offset="100%" stop-color="rgba(96,165,250,0.000)"/></radialGradient><radialGradient id="aurora-b" cx="96%" cy="4%" r="58%"><stop offset="0%" stop-color="rgba(52,211,153,0.100)"/><stop offset="100%" stop-color="rgba(52,211,153,0.000)"/></radialGradient><linearGradient id="topsheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="rgba(96,165,250,0.000)"/><stop offset="22%" stop-color="rgba(96,165,250,0.450)"/><stop offset="52%" stop-color="rgba(52,211,153,0.400)"/><stop offset="78%" stop-color="rgba(129,140,248,0.350)"/><stop offset="100%" stop-color="rgba(129,140,248,0.000)"/></linearGradient><marker id="ah-event-solid" markerWidth="11.0" markerHeight="9.0" refX="9.0" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9.0 3.5 L0 7.0 Z" fill="rgba(34,211,238,0.950)"/></marker><marker id="ah-store-solid" markerWidth="11.0" markerHeight="9.0" refX="9.0" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9.0 3.5 L0 7.0 Z" fill="rgba(240,180,41,0.950)"/></marker><marker id="ah-ai-solid" markerWidth="11.0" markerHeight="9.0" refX="9.0" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9.0 3.5 L0 7.0 Z" fill="rgba(129,140,248,0.950)"/></marker><marker id="ah-ui-solid" markerWidth="11.0" markerHeight="9.0" refX="9.0" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9.0 3.5 L0 7.0 Z" fill="rgba(96,165,250,0.950)"/></marker><marker id="ah-trust-solid" markerWidth="11.0" markerHeight="9.0" refX="9.0" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9.0 3.5 L0 7.0 Z" fill="rgba(52,211,153,0.950)"/></marker></defs><g data-name="background"><rect width="1920" height="911" fill="#070A0F"/><rect width="1920" height="911" fill="url(#grid-coarse)" opacity="0.5"/><rect width="1920" height="911" fill="url(#grid)" opacity="0.38"/><rect width="1920" height="911" fill="url(#aurora-a)"/><rect width="1920" height="911" fill="url(#aurora-b)"/><rect width="1920" height="911" fill="url(#vignette)"/><rect width="1920" height="2" fill="url(#topsheen)"/></g><g data-name="header"><text x="56.0" y="68.0" font-size="12.0" font-weight="600" fill="#60A5FA" letter-spacing="1.4">LIFECYCLE</text><text x="56.0" y="109.0" font-size="34.0" font-weight="600" fill="#E8EEF6" letter-spacing="-0.4">Re-ingestion, and what it does to system state</text><text x="56.0" y="140.0" font-size="17.0" font-weight="400" fill="#9FB0C3">A re-ingest does not clear the law first. Each store's own write path replaces it safely, which is what makes the operation survivable at any point.</text><line x1="56" y1="169.46" x2="1864" y2="169.46" stroke="#1C2736" stroke-width="1"/></g><g data-name="byline"><text x="1864.0" y="70.0" font-size="12.0" font-weight="500" fill="#9FB0C3" letter-spacing="0.3" text-anchor="end">Mohd Zamin Quadri</text><text x="1864.0" y="88.0" font-size="11.5" font-weight="400" fill="#667B91" text-anchor="end">AI Engineer · BP-ITCS</text></g><g data-name="state:SERVED" data-role="trust"><rect x="56" y="253.46" width="236" height="68.92999999999999" rx="10" fill="rgba(52,211,153,0.130)" stroke="rgba(52,211,153,0.650)" stroke-width="1.6"/><text x="174.0" y="281.0" font-size="16.0" font-weight="600" fill="#E8EEF6" letter-spacing="-0.1" text-anchor="middle">SERVED</text><text x="174.0" y="304.5" font-size="11.5" font-weight="400" fill="#9FB0C3" text-anchor="middle">the current generation, verified</text></g><g data-name="step:1"><circle cx="68" cy="239.46" r="11" fill="rgba(52,211,153,0.180)" stroke="rgba(52,211,153,0.700)" stroke-width="1.2"/><text x="68.0" y="243.8" font-size="12.0" font-weight="700" fill="#34D399" text-anchor="middle">1</text></g><g data-name="state:CAPTURE SUBMITTED" data-role="event"><rect x="358" y="253.46" width="236" height="84.34" rx="10" fill="rgba(34,211,238,0.130)" stroke="rgba(34,211,238,0.650)" stroke-width="1.6"/><text x="476.0" y="281.0" font-size="16.0" font-weight="600" fill="#E8EEF6" letter-spacing="-0.1" text-anchor="middle">CAPTURE SUBMITTED</text><text x="476.0" y="304.5" font-size="11.5" font-weight="400" fill="#9FB0C3" text-anchor="middle">new eventId, new prefix old capture</text><text x="476.0" y="319.9" font-size="11.5" font-weight="400" fill="#9FB0C3" text-anchor="middle">intact</text></g><g data-name="step:2"><circle cx="370" cy="239.46" r="11" fill="rgba(34,211,238,0.180)" stroke="rgba(34,211,238,0.700)" stroke-width="1.2"/><text x="370.0" y="243.8" font-size="12.0" font-weight="700" fill="#22D3EE" text-anchor="middle">2</text></g><g data-name="state:CANONICAL REPLACED" data-role="store"><rect x="660" y="253.46" width="236" height="68.92999999999999" rx="10" fill="rgba(240,180,41,0.130)" stroke="rgba(240,180,41,0.650)" stroke-width="1.6"/><text x="778.0" y="281.0" font-size="16.0" font-weight="600" fill="#E8EEF6" letter-spacing="-0.1" text-anchor="middle">CANONICAL REPLACED</text><text x="778.0" y="304.5" font-size="11.5" font-weight="400" fill="#9FB0C3" text-anchor="middle">one transaction version superseded</text></g><g data-name="step:3"><circle cx="672" cy="239.46" r="11" fill="rgba(240,180,41,0.180)" stroke="rgba(240,180,41,0.700)" stroke-width="1.2"/><text x="672.0" y="243.8" font-size="12.0" font-weight="700" fill="#F0B429" text-anchor="middle">3</text></g><g data-name="state:PROJECTIONS CONVERGING" data-role="ai"><rect x="962" y="253.46" width="236" height="88.45" rx="10" fill="rgba(129,140,248,0.130)" stroke="rgba(129,140,248,0.650)" stroke-width="1.6"/><text x="1080.0" y="281.0" font-size="16.0" font-weight="600" fill="#E8EEF6" letter-spacing="-0.1" text-anchor="middle">PROJECTIONS</text><text x="1080.0" y="300.5" font-size="16.0" font-weight="600" fill="#E8EEF6" letter-spacing="-0.1" text-anchor="middle">CONVERGING</text><text x="1080.0" y="324.0" font-size="11.5" font-weight="400" fill="#9FB0C3" text-anchor="middle">Qdrant upsert then delete stale</text></g><g data-name="step:4"><circle cx="974" cy="239.46" r="11" fill="rgba(129,140,248,0.180)" stroke="rgba(129,140,248,0.700)" stroke-width="1.2"/><text x="974.0" y="243.8" font-size="12.0" font-weight="700" fill="#818CF8" text-anchor="middle">4</text></g><g data-name="state:MEASURED" data-role="ui"><rect x="1264" y="253.46" width="236" height="68.92999999999999" rx="10" fill="rgba(96,165,250,0.130)" stroke="rgba(96,165,250,0.650)" stroke-width="1.6"/><text x="1382.0" y="281.0" font-size="16.0" font-weight="600" fill="#E8EEF6" letter-spacing="-0.1" text-anchor="middle">MEASURED</text><text x="1382.0" y="304.5" font-size="11.5" font-weight="400" fill="#9FB0C3" text-anchor="middle">gates have run, verdicts recorded</text></g><g data-name="step:5"><circle cx="1276" cy="239.46" r="11" fill="rgba(96,165,250,0.180)" stroke="rgba(96,165,250,0.700)" stroke-width="1.2"/><text x="1276.0" y="243.8" font-size="12.0" font-weight="700" fill="#60A5FA" text-anchor="middle">5</text></g><g data-name="state:SERVED" data-role="trust"><rect x="1562" y="249.46" width="244" height="76.92999999999999" rx="14" fill="none" stroke="rgba(52,211,153,0.300)" stroke-width="1"/><rect x="1566" y="253.46" width="236" height="68.92999999999999" rx="10" fill="rgba(52,211,153,0.130)" stroke="rgba(52,211,153,0.650)" stroke-width="1.6"/><text x="1684.0" y="281.0" font-size="16.0" font-weight="600" fill="#E8EEF6" letter-spacing="-0.1" text-anchor="middle">SERVED</text><text x="1684.0" y="304.5" font-size="11.5" font-weight="400" fill="#9FB0C3" text-anchor="middle">the new generation, verified</text></g><g data-name="step:6"><circle cx="1578" cy="239.46" r="11" fill="rgba(52,211,153,0.180)" stroke="rgba(52,211,153,0.700)" stroke-width="1.2"/><text x="1578.0" y="243.8" font-size="12.0" font-weight="700" fill="#34D399" text-anchor="middle">6</text></g><g data-name="edge:sync:unlabelled"><path d="M297.0 287.9 L326.1 287.9 Q330.0 287.9 330.0 291.8 L330.0 291.8 Q330.0 295.6 333.9 295.6 L363.0 295.6" fill="none" stroke="rgba(34,211,238,0.850)" stroke-width="1.4" marker-end="url(#ah-event-solid)" stroke-linecap="round"/></g><g data-name="edge:sync:unlabelled"><path d="M599.0 295.6 L628.1 295.6 Q632.0 295.6 632.0 291.8 L632.0 291.8 Q632.0 287.9 635.9 287.9 L665.0 287.9" fill="none" stroke="rgba(240,180,41,0.850)" stroke-width="1.4" marker-end="url(#ah-store-solid)" stroke-linecap="round"/></g><g data-name="edge:sync:unlabelled"><path d="M901.0 287.9 L929.1 287.9 Q934.0 287.9 934.0 292.8 L934.0 292.8 Q934.0 297.7 938.9 297.7 L967.0 297.7" fill="none" stroke="rgba(129,140,248,0.850)" stroke-width="1.4" marker-end="url(#ah-ai-solid)" stroke-linecap="round"/></g><g data-name="edge:sync:unlabelled"><path d="M1203.0 297.7 L1231.1 297.7 Q1236.0 297.7 1236.0 292.8 L1236.0 292.8 Q1236.0 287.9 1240.9 287.9 L1269.0 287.9" fill="none" stroke="rgba(96,165,250,0.850)" stroke-width="1.4" marker-end="url(#ah-ui-solid)" stroke-linecap="round"/></g><g data-name="edge:sync:unlabelled"><path d="M1505.0 287.9 L1538.0 287.9 L1538.0 287.9 L1571.0 287.9" fill="none" stroke="rgba(52,211,153,0.850)" stroke-width="1.4" marker-end="url(#ah-trust-solid)" stroke-linecap="round"/></g><text x="56.0" y="381.9" font-size="12.0" font-weight="600" fill="#34D399" letter-spacing="1.4">WHAT A READER SEES AT EACH STATE</text><g data-name="matrix:reingest-states"><rect x="56" y="397.91" width="1720" height="30" rx="6" fill="rgba(232,238,246,0.040)"/><text x="68.0" y="416.9" font-size="12.0" font-weight="600" fill="#667B91" letter-spacing="1.4">STATE</text><text x="398.0" y="416.9" font-size="12.0" font-weight="600" fill="#667B91" letter-spacing="1.4">POSTGRESQL SERVES</text><text x="728.0" y="416.9" font-size="12.0" font-weight="600" fill="#667B91" letter-spacing="1.4">QDRANT SERVES</text><text x="1078.0" y="416.9" font-size="12.0" font-weight="600" fill="#667B91" letter-spacing="1.4">NEO4J SERVES</text><text x="1428.0" y="416.9" font-size="12.0" font-weight="600" fill="#667B91" letter-spacing="1.4">BADGE SHOWS</text><text x="68.0" y="449.9" font-size="11.5" font-weight="400" fill="rgba(52,211,153,0.950)">1 SERVED</text><text x="398.0" y="449.9" font-size="11.5" font-weight="400" fill="#9FB0C3">old generation</text><text x="728.0" y="449.9" font-size="11.5" font-weight="400" fill="#9FB0C3">old vectors</text><text x="1078.0" y="449.9" font-size="11.5" font-weight="400" fill="#9FB0C3">old graph</text><text x="1428.0" y="449.9" font-size="11.5" font-weight="400" fill="#9FB0C3">VERIFIED</text><rect x="56" y="464.91" width="1720" height="34" rx="4" fill="rgba(232,238,246,0.022)"/><text x="68.0" y="483.9" font-size="11.5" font-weight="400" fill="rgba(34,211,238,0.950)">2 CAPTURE SUBMITTED</text><text x="398.0" y="483.9" font-size="11.5" font-weight="400" fill="#9FB0C3">old generation</text><text x="728.0" y="483.9" font-size="11.5" font-weight="400" fill="#9FB0C3">old vectors</text><text x="1078.0" y="483.9" font-size="11.5" font-weight="400" fill="#9FB0C3">old graph</text><text x="1428.0" y="483.9" font-size="11.5" font-weight="400" fill="#9FB0C3">VERIFIED, ingest in progress</text><text x="68.0" y="517.9" font-size="11.5" font-weight="400" fill="rgba(248,113,113,0.950)">3 CANONICAL REPLACED</text><text x="398.0" y="517.9" font-size="11.5" font-weight="400" fill="#9FB0C3">new generation</text><text x="728.0" y="517.9" font-size="11.5" font-weight="400" fill="#9FB0C3">old vectors</text><text x="1078.0" y="517.9" font-size="11.5" font-weight="400" fill="#9FB0C3">old graph</text><text x="1428.0" y="517.9" font-size="11.5" font-weight="400" fill="#9FB0C3">stale — drift is real here</text><rect x="56" y="532.9100000000001" width="1720" height="34" rx="4" fill="rgba(232,238,246,0.022)"/><text x="68.0" y="551.9" font-size="11.5" font-weight="400" fill="rgba(129,140,248,0.950)">4 PROJECTIONS CONVERGING</text><text x="398.0" y="551.9" font-size="11.5" font-weight="400" fill="#9FB0C3">new generation</text><text x="728.0" y="551.9" font-size="11.5" font-weight="400" fill="#9FB0C3">new vectors after the fence</text><text x="1078.0" y="551.9" font-size="11.5" font-weight="400" fill="#9FB0C3">new graph after the fence</text><text x="1428.0" y="551.9" font-size="11.5" font-weight="400" fill="#9FB0C3">ingest in progress</text><text x="68.0" y="585.9" font-size="11.5" font-weight="400" fill="rgba(96,165,250,0.950)">5 MEASURED</text><text x="398.0" y="585.9" font-size="11.5" font-weight="400" fill="#9FB0C3">new generation</text><text x="728.0" y="585.9" font-size="11.5" font-weight="400" fill="#9FB0C3">new vectors</text><text x="1078.0" y="585.9" font-size="11.5" font-weight="400" fill="#9FB0C3">new graph</text><text x="1428.0" y="585.9" font-size="11.5" font-weight="400" fill="#9FB0C3">verdict per gate</text><rect x="56" y="600.9100000000001" width="1720" height="34" rx="4" fill="rgba(232,238,246,0.022)"/><text x="68.0" y="619.9" font-size="11.5" font-weight="400" fill="rgba(52,211,153,0.950)">6 SERVED</text><text x="398.0" y="619.9" font-size="11.5" font-weight="400" fill="#9FB0C3">new generation</text><text x="728.0" y="619.9" font-size="11.5" font-weight="400" fill="#9FB0C3">new vectors</text><text x="1078.0" y="619.9" font-size="11.5" font-weight="400" fill="#9FB0C3">new graph</text><text x="1428.0" y="619.9" font-size="11.5" font-weight="400" fill="#9FB0C3">VERIFIED</text><line x1="56" y1="637.9100000000001" x2="1776" y2="637.9100000000001" stroke="#1C2736" stroke-width="1"/></g><g data-name="note"><rect x="56" y="663.9100000000001" width="2.5" height="99.0" rx="1.2" fill="rgba(248,113,113,0.850)"/><text x="70.0" y="675.9" font-size="12.0" font-weight="600" fill="rgba(248,113,113,0.950)" letter-spacing="1.4">THE WINDOW THAT IS NOT HIDDEN</text><text x="70.0" y="695.9" font-size="12.5" font-weight="400" fill="#9FB0C3">State 3 is the honest part of this diagram. Between the canonical commit and the projection fences, PostgreSQL holds the new generation while Qdrant</text><text x="70.0" y="713.7" font-size="12.5" font-weight="400" fill="#9FB0C3">and Neo4j still hold the old one. That window is real, it is short, and reconciliation will report it as DRIFT_DETECTED if it is sampled inside it.</text><text x="70.0" y="731.4" font-size="12.5" font-weight="400" fill="#9FB0C3">It is accepted rather than eliminated, because the alternative — a distributed transaction across a relational store, a vector store and a graph store —</text><text x="70.0" y="749.2" font-size="12.5" font-weight="400" fill="#9FB0C3">buys consistency at a cost the corpus does not need. Nothing serves a partial law: the old generation answers until the new one is complete.</text></g><g data-name="note"><rect x="972.0" y="663.9100000000001" width="2.5" height="99.0" rx="1.2" fill="rgba(96,165,250,0.850)"/><text x="986.0" y="675.9" font-size="12.0" font-weight="600" fill="rgba(96,165,250,0.950)" letter-spacing="1.4">NOTHING ADVANCES ON ITS OWN</text><text x="986.0" y="695.9" font-size="12.5" font-weight="400" fill="#9FB0C3">No state here is entered by a timer, a retry policy or a repair daemon. A re-ingest is an operator action, every transition is driven by an event the</text><text x="986.0" y="713.7" font-size="12.5" font-weight="400" fill="#9FB0C3">previous stage published, and if a stage fails the machine stops in place rather than advancing.</text><text x="986.0" y="731.4" font-size="12.5" font-weight="400" fill="#9FB0C3">That is a deliberate choice about a legal corpus: an automatic self-heal that silently re-derives knowledge is indistinguishable, afterwards, from an</text><text x="986.0" y="749.2" font-size="12.5" font-weight="400" fill="#9FB0C3">automatic self-heal that silently corrupted it.</text></g><g data-name="legend"><text x="56.0" y="826.9" font-size="12.0" font-weight="600" fill="#667B91" letter-spacing="1.4">ROLE</text><circle cx="115" cy="822.9100000000001" r="4.6" fill="#22D3EE" opacity="0.92"/><text x="125.0" y="826.9" font-size="12.0" font-weight="500" fill="#9FB0C3" letter-spacing="0.3">Event / transport</text><circle cx="255.40175999999997" cy="822.9100000000001" r="4.6" fill="#818CF8" opacity="0.92"/><text x="265.4" y="826.9" font-size="12.0" font-weight="500" fill="#9FB0C3" letter-spacing="0.3">AI / ML</text><circle cx="337.91263999999995" cy="822.9100000000001" r="4.6" fill="#F0B429" opacity="0.92"/><text x="347.9" y="826.9" font-size="12.0" font-weight="500" fill="#9FB0C3" letter-spacing="0.3">Persistence</text><circle cx="446.88303999999994" cy="822.9100000000001" r="4.6" fill="#34D399" opacity="0.92"/><text x="456.9" y="826.9" font-size="12.0" font-weight="500" fill="#9FB0C3" letter-spacing="0.3">Verification / trust</text><circle cx="595.1068799999999" cy="822.9100000000001" r="4.6" fill="#60A5FA" opacity="0.92"/><text x="605.1" y="826.9" font-size="12.0" font-weight="500" fill="#9FB0C3" letter-spacing="0.3">Operator / API</text><circle cx="720.5215999999999" cy="822.9100000000001" r="4.6" fill="#F87171" opacity="0.92"/><text x="730.5" y="826.9" font-size="12.0" font-weight="500" fill="#9FB0C3" letter-spacing="0.3">Failure path</text><text x="56.0" y="848.9" font-size="12.0" font-weight="600" fill="#667B91" letter-spacing="1.4">FLOW</text><line x1="110" y1="844.9100000000001" x2="136" y2="844.9100000000001" stroke="#667B91" stroke-width="1.4"/><text x="144.0" y="848.9" font-size="12.0" font-weight="500" fill="#9FB0C3" letter-spacing="0.3">synchronous request</text></g></svg>