"#667B91">canonical record</text><rect x="546.5" y="730" width="400.5" height="96" rx="12" fill="rgba(240,180,41,0.090)" stroke="rgba(240,180,41,0.500)" stroke-width="1.4"/><rect x="549.5" y="733" width="394.5" height="90" rx="9" fill="none" stroke="rgba(240,180,41,0.240)" stroke-width="1"/><text x="570.5" y="772" font-family='Inter, "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif' font-size="23" font-weight="600" fill="#E8EEF6">Qdrant</text><text x="570.5" y="800" font-family='Inter, "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif' font-size="15" fill="#667B91">semantic retrieval</text><rect x="973.0" y="730" width="400.5" height="96" rx="12" fill="rgba(240,180,41,0.090)" stroke="rgba(240,180,41,0.500)" stroke-width="1.4"/><rect x="976.0" y="733" width="394.5" height="90" rx="9" fill="none" stroke="rgba(240,180,41,0.240)" stroke-width="1"/><text x="997.0" y="772" font-family='Inter, "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif' font-size="23" font-weight="600" fill="#E8EEF6">Neo4j</text><text x="997.0" y="800" font-family='Inter, "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif' font-size="15" fill="#667B91">reference traversal</text><rect x="1399.5" y="730" width="400.5" height="96" rx="12" fill="rgba(240,180,41,0.090)" stroke="rgba(240,180,41,0.500)" stroke-width="1.4"/><rect x="1402.5" y="733" width="394.5" height="90" rx="9" fill="none" stroke="rgba(240,180,41,0.240)" stroke-width="1"/><text x="1423.5" y="772" font-family='Inter, "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif' font-size="23" font-weight="600" fill="#E8EEF6">MinIO</text><text x="1423.5" y="800" font-family='Inter, "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif' font-size="15" fill="#667B91">immutable evidence</text><text x="120" y="708" font-family='Inter, "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif' font-size="14" font-weight="600" fill="#667B91" letter-spacing="1.6">ONE WRITER EACH</text><rect x="120" y="904" width="3" height="72" rx="1.5" fill="rgba(52,211,153,0.850)"/><text x="142" y="930" font-family='Inter, "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif' font-size="21" fill="#9FB0C3">Every stored item re-derivable from the publisher’s own bytes, under a recorded set of rules.</text><text x="142" y="962" font-family='Inter, "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif' font-size="21" fill="#9FB0C3">When it cannot be, the system says so rather than serving it quietly.</text></svg>