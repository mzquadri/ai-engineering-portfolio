lor="rgba(167,139,250,0.055)"/></linearGradient><filter id="cardshadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#000000" flood-opacity="0.40"/></filter><filter id="glow-ai" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#818CF8" flood-opacity="0.26"/></filter><linearGradient id="glass-ai" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgba(129,140,248,0.200)"/><stop offset="55%" stop-color="rgba(129,140,248,0.105)"/><stop offset="100%" stop-color="rgba(129,140,248,0.055)"/></linearGradient><filter id="glow-trust" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#34D399" flood-opacity="0.26"/></filter><linearGradient id="glass-trust" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgba(52,211,153,0.200)"/><stop offset="55%" stop-color="rgba(52,211,153,0.105)"/><stop offset="100%" stop-color="rgba(52,211,153,0.055)"/></linearGradient><filter id="glow-ui" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#60A5FA" flood-opacity="0.26"/></filter><linearGradient id="glass-ui" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgba(96,165,250,0.200)"/><stop offset="55%" stop-color="rgba(96,165,250,0.105)"/><stop offset="100%" stop-color="rgba(96,165,250,0.055)"/></linearGradient><marker id="ah-ai-solid" markerWidth="11.0" markerHeight="9.0" refX="9.0" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9.0 3.5 L0 7.0 Z" fill="rgba(129,140,248,0.950)"/></marker><marker id="ah-trust-solid" markerWidth="11.0" markerHeight="9.0" refX="9.0" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9.0 3.5 L0 7.0 Z" fill="rgba(52,211,153,0.950)"/></marker><marker id="ah-ui-solid" markerWidth="11.0" markerHeight="9.0" refX="9.0" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9.0 3.5 L0 7.0 Z" fill="rgba(96,165,250,0.950)"/></marker></defs><g data-name="background"><rect width="1920" height="655" fill="#070A0F"/><rect width="1920" height="655" fill="url(#grid-coarse)" opacity="0.5"/><rect width="1920" height="655" fill="url(#grid)" opacity="0.38"/><rect width="1920" height="655" fill="url(#aurora-a)"/><rect width="1920" height="655" fill="url(#aurora-b)"/><rect width="1920" height="655" fill="url(#vignette)"/><rect width="1920" height="2" fill="url(#topsheen)"/></g><g data-name="header"><text x="56.0" y="68.0" font-size="12.0" font-weight="600" fill="#60A5FA" letter-spacing="1.4">LEVEL 1 · EXECUTIVE</text><text x="56.0" y="109.0" font-size="34.0" font-weight="600" fill="#E8EEF6" letter-spacing="-0.4">Authoritative information, made trustworthy and machine-readable</text><text x="56.0" y="140.0" font-size="17.0" font-weight="400" fill="#9FB0C3">No technology names. Four capabilities and the promise each one makes.</text><line x1="56" y1="169.46" x2="1864" y2="169.46" stroke="#1C2736" stroke-width="1"/></g><g data-name="byline"><text x="1864.0" y="70.0" font-size="12.0" font-weight="500" fill="#9FB0C3" letter-spacing="0.3" text-anchor="end">Mohd Zamin Quadri</text><text x="1864.0" y="88.0" font-size="11.5" font-weight="400" fill="#667B91" text-anchor="end">AI Engineer · BP-ITCS</text></g><g data-name="card:Authoritative information" data-role="source" data-level="primary"><rect x="56.0" y="251.46" width="419.0" height="85.62" rx="10" fill="#0E141C" filter="url(#glow-source)"/><rect x="56.0" y="251.46" width="419.0" height="85.62" rx="10" fill="rgba(7,10,15,0.720)" filter="url(#cardshadow)"/><rect x="56.0" y="251.46" width="419.0" height="85.62" rx="10" fill="url(#glass-source)" stroke="rgba(167,139,250,0.620)" stroke-width="2.0"/><path d="M66.0 252.36H465.0" stroke="rgba(255,255,255,0.110)" stroke-width="1" fill="none"/><polygon points="465.0,251.46 475.0,251.46 475.0,261.46000000000004" fill="#A78BFA" opacity="0.9"/><circle cx="80.0" cy="272.46000000000004" r="5.8" fill="none" stroke="#A78BFA" stroke-width="1.3"/><ellipse cx="80.0" cy="272.46000000000004" rx="2.4" ry="5.8" fill="none" stroke="#A78BFA" stroke-width="1.3" stroke-opacity="0.7"/><line x1="74.3" y1="272.46000000000004" x2="85.7" y2="272.46000000000004" stroke="#A78BFA" stroke-width="1.3" stroke-opacity="0.7"/><text x="94.0" y="278.6" font-size="16.0" font-weight="600" fill="#E8EEF6" letter-spacing="-0.1">Authoritative information</text><text x="72.0" y="301.1" font-size="13.0" font-weight="400" fill="#9FB0C3">Published law and business documents, taken from the body</text><text x="72.0" y="318.7" font-size="13.0" font-weight="400" fill="#9FB0C3">that issues them</text></g><g data-name="card:A knowledge platform" data-role="ai" data-level="primary"><rect x="519.0" y="251.46" width="419.0" height="68.07" rx="10" fill="#0E141C" filter="url(#glow-ai)"/><rect x="519.0" y="251.46" width="419.0" height="68.07" rx="10" fill="rgba(7,10,15,0.720)" filter="url(#cardshadow)"/><rect x="519.0" y="251.46" width="419.0" height="68.07" rx="10" fill="url(#glass-ai)" stroke="rgba(129,140,248,0.620)" stroke-width="2.0"/><path d="M529.0 252.36H928.0" stroke="rgba(255,255,255,0.110)" stroke-width="1" fill="none"/><polygon points="928.0,251.46 938.0,251.46 938.0,261.46000000000004" fill="#818CF8" opacity="0.9"/><path d="M543.0 266.96000000000004c-3 0-5 1.9-5 4.2 0 1 .4 1.9 1 2.6-.4.6-.6 1.2-.6 1.9 0 1.6 1.4 2.8 3.2 2.8 .9 0 1.7-.3 2.3-.8.6.5 1.4.8 2.3.8 1.8 0 3.2-1.2 3.2-2.8 0-.7-.2-1.3-.6-1.9.6-.7 1-1.6 1-2.6 0-2.3-2-4.2-5-4.2Z" fill="none" stroke="#818CF8" stroke-width="1.3"/><line x1="543.0" y1="268.46000000000004" x2="543.0" y2="277.96000000000004" stroke="#818CF8" stroke-width="1.3" stroke-opacity="0.7"/><text x="557.0" y="278.6" font-size="16.0" font-weight="600" fill="#E8EEF6" letter-spacing="-0.1">A knowledge platform</text><text x="535.0" y="301.1" font-size="13.0" font-weight="400" fill="#9FB0C3">Extraction, structure, citation resolution and semantic indexing</text></g><g data-name="card:Verified knowledge" data-role="trust" data-level="primary"><rect x="982.0" y="251.46" width="419.0" height="85.62" rx="10" fill="#0E141C" filter="url(#glow-trust)"/><rect x="982.0" y="251.46" width="419.0" height="85.62" rx="10" fill="rgba(7,10,15,0.720)" filter="url(#cardshadow)"/><rect x="982.0" y="251.46" width="419.0" height="85.62" rx="10" fill="url(#glass-trust)" stroke="rgba(52,211,153,0.620)" stroke-width="2.0"/><path d="M992.0 252.36H1391.0" stroke="rgba(255,255,255,0.110)" stroke-width="1" fill="none"/><polygon points="1391.0,251.46 1401.0,251.46 1401.0,261.46000000000004" fill="#34D399" opacity="0.9"/><path d="M1006.0 266.46000000000004l5 2v4.2c0 3.2-2.1 5.6-5 6.6c-2.9-1-5-3.4-5-6.6v-4.2z" fill="none" stroke="#34D399" stroke-width="1.3" stroke-linejoin="round"/><path d="M1003.4 272.46000000000004l2 2 3.4-3.6" fill="none" stroke="#34D399" stroke-width="1.5" stroke-linecap="round"/><text x="1020.0" y="278.6" font-size="16.0" font-weight="600" fill="#E8EEF6" letter-spacing="-0.1">Verified knowledge</text><text x="998.0" y="301.1" font-size="13.0" font-weight="400" fill="#9FB0C3">Independent measurement of what was stored against what was</text><text x="998.0" y="318.7" font-size="13.0" font-weight="400" fill="#9FB0C3">served</text></g><g data-name="card:Applications" data-role="ui" data-level="primary"><rect x="1445.0" y="251.46" width="419.0" height="85.62" rx="10" fill="#0E141C" filter="url(#glow-ui)"/><rect x="1445.0" y="251.46" width="419.0" height="85.62" rx="10" fill="rgba(7,10,15,0.720)" filter="url(#cardshadow)"/><rect x="1445.0" y="251.46" width="419.0" height="85.62" rx="10" fill="url(#glass-ui)" stroke="rgba(96,165,250,0.620)" stroke-width="2.0"/><path d="M1455.0 252.36H1854.0" stroke="rgba(255,255,255,0.110)" stroke-width="1" fill="none"/><polygon points="1854.0,251.46 1864.0,251.46 1864.0,261.46000000000004" fill="#60A5FA" opacity="0.9"/><rect x="1463.0" y="267.46000000000004" width="12" height="10" rx="1.8" fill="none" stroke="#60A5FA" stroke-width="1.3"/><line x1="1463.0" y1="270.46000000000004" x2="1475.0" y2="270.46000000000004" stroke="#60A5FA" stroke-width="1.3"/><circle cx="1465.2" cy="268.96000000000004" r="0.8" fill="#60A5FA"/><text x="1483.0" y="278.6" font-size="16.0" font-weight="600" fill="#E8EEF6" letter-spacing="-0.1">Applications</text><text x="1461.0" y="301.1" font-size="13.0" font-weight="400" fill="#9FB0C3">Grounded search and answering, with operator control of the</text><text x="1461.0" y="318.7" font-size="13.0" font-weight="400" fill="#9FB0C3">lifecycle</text></g><g data-name="note"><rect x="56.0" y="357.08000000000004" width="2.5" height="45.75" rx="1.2" fill="rgba(167,139,250,0.850)"/><text x="70.0" y="369.1" font-size="12.0" font-weight="600" fill="rgba(167,139,250,0.950)" letter-spacing="1.4">THE PROMISE</text><text x="70.0" y="389.1" font-size="12.5" font-weight="400" fill="#9FB0C3">We can always show which file we used, and when.</text></g><g data-name="note"><rect x="519.0" y="357.08000000000004" width="2.5" height="45.75" rx="1.2" fill="rgba(129,140,248,0.850)"/><text x="533.0" y="369.1" font-size="12.0" font-weight="600" fill="rgba(129,140,248,0.950)" letter-spacing="1.4">THE PROMISE</text><text x="533.0" y="389.1" font-size="12.5" font-weight="400" fill="#9FB0C3">Content becomes queryable without losing what it came from.</text></g><g data-name="note"><rect x="982.0" y="357.08000000000004" width="2.5" height="45.75" rx="1.2" fill="rgba(52,211,153,0.850)"/><text x="996.0" y="369.1" font-size="12.0" font-weight="600" fill="rgba(52,211,153,0.950)" letter-spacing="1.4">THE PROMISE</text><text x="996.0" y="389.1" font-size="12.5" font-weight="400" fill="#9FB0C3">We can state what is trustworthy, and what is merely present.</text></g><g data-name="note"><rect x="1445.0" y="357.08000000000004" width="2.5" height="63.5" rx="1.2" fill="rgba(96,165,250,0.850)"/><text x="1459.0" y="369.1" font-size="12.0" font-weight="600" fill="rgba(96,165,250,0.950)" letter-spacing="1.4">THE PROMISE</text><text x="1459.0" y="389.1" font-size="12.5" font-weight="400" fill="#9FB0C3">Answers cite provisions, and a person decides what enters the</text><text x="1459.0" y="406.8" font-size="12.5" font-weight="400" fill="#9FB0C3">corpus.</text></g><g data-name="edge:sync:unlabelled"><path d="M481.0 294.3 L498.6 294.3 Q503.0 294.3 503.0 289.9 L503.0 289.9 Q503.0 285.5 507.4 285.5 L525.0 285.5" fill="none" stroke="rgba(129,140,248,0.850)" stroke-width="1.4" marker-end="url(#ah-ai-solid)" stroke-linecap="round"/></g><g data-name="edge:sync:unlabelled"><path d="M944.0 285.5 L961.6 285.5 Q966.0 285.5 966.0 289.9 L966.0 289.9 Q966.0 294.3 970.4 294.3 L988.0 294.3" fill="none" stroke="rgba(52,211,153,0.850)" stroke-width="1.4" marker-end="url(#ah-trust-solid)" stroke-linecap="round"/></g><g data-name="edge:sync:unlabelled"><path d="M1407.0 294.3 L1429.0 294.3 L1429.0 294.3 L1451.0 294.3" fill="none" stroke="rgba(96,165,250,0.850)" stroke-width="1.4" marker-end="url(#ah-ui-solid)" stroke-linecap="round"/></g><g data-name="note"><rect x="56" y="489.08000000000004" width="2.5" height="63.5" rx="1.2" fill="rgba(52,211,153,0.850)"/><text x="70.0" y="501.1" font-size="12.0" font-weight="600" fill="rgba(52,211,153,0.950)" letter-spacing="1.4">WHY THIS IS DIFFERENT FROM SEARCH</text><text x="70.0" y="521.1" font-size="12.5" font-weight="400" fill="#9FB0C3">The distinction that matters at this level: the platform does not only make information searchable, it makes claims about that information falsifiable. Every stored item can be re-derived from the publisher's own bytes under a recorded set of rules, and if it cannot be, the system says so rather than serving it</text><text x="70.0" y="538.8" font-size="12.5" font-weight="400" fill="#9FB0C3">quietly.</text></g><g data-name="legend"><text x="56.0" y="592.6" font-size="12.0" font-weight="600" fill="#667B91" letter-spacing="1.4">ROLE</text><circle cx="115" cy="588.58" r="4.6" fill="#A78BFA" opacity="0.92"/><text x="125.0" y="592.6" font-size="12.0" font-weight="500" fill="#9FB0C3" letter-spacing="0.3">External source</text><circle cx="246.66528" cy="588.58" r="4.6" fill="#818CF8" opacity="0.92"/><text x="256.7" y="592.6" font-size="12.0" font-weight="500" fill="#9FB0C3" letter-spacing="0.3">AI / ML</text><circle cx="329.17616" cy="588.58" r="4.6" fill="#34D399" opacity="0.92"/><text x="339.2" y="592.6" font-size="12.0" font-weight="500" fill="#9FB0C3" letter-spacing="0.3">Verification / trust</text><circle cx="477.4" cy="588.58" r="4.6" fill="#60A5FA" opacity="0.92"/><text x="487.4" y="592.6" font-size="12.0" font-weight="500" fill="#9FB0C3" letter-spacing="0.3">Operator / API</text></g></svg>