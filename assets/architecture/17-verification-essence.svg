<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="706" viewBox="0 0 1920 706" role="img" aria-label="Why the verdict is worth believing" font-family='Inter, "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif'><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16202C" stroke-width="1" stroke-opacity="0.5"/></pattern><pattern id="grid-coarse" width="200" height="200" patternUnits="userSpaceOnUse"><path d="M200 0H0V200" fill="none" stroke="#16202C" stroke-width="1.4" stroke-opacity="0.9"/></pattern><radialGradient id="vignette" cx="50%" cy="120%" r="120%"><stop offset="0%" stop-color="rgba(0,0,0,0.340)"/><stop offset="55%" stop-color="rgba(0,0,0,0.100)"/><stop offset="100%" stop-color="rgba(0,0,0,0.000)"/></radialGradient><radialGradient id="aurora-a" cx="8%" cy="-6%" r="62%"><stop offset="0%" stop-color="rgba(96,165,250,0.130)"/><stop offset="100%" stop-color="rgba(96,165,250,0.000)"/></radialGradient><radialGradient id="aurora-b" cx="96%" cy="4%" r="58%"><stop offset="0%" stop-color="rgba(52,211,153,0.100)"/><stop offset="100%" stop-color="rgba(52,211,153,0.000)"/></radialGradient><linearGradient id="topsheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="rgba(96,165,250,0.000)"/><stop offset="22%" stop-color="rgba(96,165,250,0.450)"/><stop offset="52%" stop-color="rgba(52,211,153,0.400)"/><stop offset="78%" stop-color="rgba(129,140,248,0.350)"/><stop offset="100%" stop-color="rgba(129,140,248,0.000)"/></linearGradient><filter id="glow-source" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#A78BFA" flood-opacity="0.26"/></filter><linearGradient id="glass-source" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgba(167,139,250,0.200)"/><stop offset="55%" stop-color="rgba(167,139,250,0.105)"/><stop offset="100%" stop-color="rgba(167,139,250,0.055)"/></linearGradient><filter id="cardshadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#000000" flood-opacity="0.40"/></filter><filter id="glow-trust" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#34D399" flood-opacity="0.26"/></filter><linearGradient id="glass-trust" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgba(52,211,153,0.200)"/><stop offset="55%" stop-color="rgba(52,211,153,0.105)"/><stop offset="100%" stop-color="rgba(52,211,153,0.055)"/></linearGradient><filter id="glow-ui" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#60A5FA" flood-opacity="0.26"/></filter><linearGradient id="glass-ui" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgba(96,165,250,0.200)"/><stop offset="55%" stop-color="rgba(96,165,250,0.105)"/><stop offset="100%" stop-color="rgba(96,165,250,0.055)"/></linearGradient><marker id="ah-trust-solid" markerWidth="11.0" markerHeight="9.0" refX="9.0" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9.0 3.5 L0 7.0 Z" fill="rgba(52,211,153,0.950)"/></marker></defs><g data-name="background"><rect width="1920" height="706" fill="#070A0F"/><rect width="1920" height="706" fill="url(#grid-coarse)" opacity="0.5"/><rect width="1920" height="706" fill="url(#grid)" opacity="0.38"/><rect width="1920" height="706" fill="url(#aurora-a)"/><rect width="1920" height="706" fill="url(#aurora-b)"/><rect width="1920" height="706" fill="url(#vignette)"/><rect width="1920" height="2" fill="url(#topsheen)"/></g><g data-name="header"><text x="56.0" y="68.0" font-size="12.0" font-weight="600" fill="#60A5FA" letter-spacing="1.4">VERIFICATION · THE SHORT VERSION</text><text x="56.0" y="109.0" font-size="34.0" font-weight="600" fill="#E8EEF6" letter-spacing="-0.4">Why the verdict is worth believing</text><text x="56.0" y="140.0" font-size="17.0" font-weight="400" fill="#9FB0C3">Six mechanisms. Each one exists to stop the verification layer from confirming itself.</text><line x1="56" y1="169.46" x2="1864" y2="169.46" stroke="#1C2736" stroke-width="1"/></g><g data-name="byline"><text x="1864.0" y="70.0" font-size="12.0" font-weight="500" fill="#9FB0C3" letter-spacing="0.3" text-anchor="end">Mohd Zamin Quadri</text><text x="1864.0" y="88.0" font-size="11.5" font-weight="400" fill="#667B91" text-anchor="end">AI Engineer · BP-ITCS</text></g><g data-name="card:1 · The bytes are hashed first" data-role="source" data-level="primary"><rect x="56" y="247.46" width="585.3333333333334" height="85.62" rx="10" fill="#0E141C" filter="url(#glow-source)"/><rect x="56" y="247.46" width="585.3333333333334" height="85.62" rx="10" fill="rgba(7,10,15,0.720)" filter="url(#cardshadow)"/><rect x="56" y="247.46" width="585.3333333333334" height="85.62" rx="10" fill="url(#glass-source)" stroke="rgba(167,139,250,0.620)" stroke-width="2.0"/><path d="M66 248.36H631.3333333333334" stroke="rgba(255,255,255,0.110)" stroke-width="1" fill="none"/><polygon points="631.3333333333334,247.46 641.3333333333334,247.46 641.3333333333334,257.46000000000004" fill="#A78BFA" opacity="0.9"/><circle cx="80" cy="268.46000000000004" r="5.8" fill="none" stroke="#A78BFA" stroke-width="1.3"/><ellipse cx="80" cy="268.46000000000004" rx="2.4" ry="5.8" fill="none" stroke="#A78BFA" stroke-width="1.3" stroke-opacity="0.7"/><line x1="74.3" y1="268.46000000000004" x2="85.7" y2="268.46000000000004" stroke="#A78BFA" stroke-width="1.3" stroke-opacity="0.7"/><text x="94.0" y="274.6" font-size="16.0" font-weight="600" fill="#E8EEF6" letter-spacing="-0.1">1 · The bytes are hashed first</text><text x="72.0" y="297.1" font-size="13.0" font-weight="400" fill="#9FB0C3">SHA-256 over the publisher's own file, before any parser reads it. A claim about a law is only</text><text x="72.0" y="314.7" font-size="13.0" font-weight="400" fill="#9FB0C3">as good as the bytes it came from.</text></g><g data-name="card:2 · A second, independent reading" data-role="trust" data-level="primary"><rect x="667.3333333333334" y="247.46" width="585.3333333333334" height="85.62" rx="10" fill="#0E141C" filter="url(#glow-trust)"/><rect x="667.3333333333334" y="247.46" width="585.3333333333334" height="85.62" rx="10" fill="rgba(7,10,15,0.720)" filter="url(#cardshadow)"/><rect x="667.3333333333334" y="247.46" width="585.3333333333334" height="85.62" rx="10" fill="url(#glass-trust)" stroke="rgba(52,211,153,0.620)" stroke-width="2.0"/><path d="M677.3333333333334 248.36H1242.6666666666667" stroke="rgba(255,255,255,0.110)" stroke-width="1" fill="none"/><polygon points="1242.6666666666667,247.46 1252.6666666666667,247.46 1252.6666666666667,257.46000000000004" fill="#34D399" opacity="0.9"/><path d="M691.3333333333334 262.46000000000004l5 2v4.2c0 3.2-2.1 5.6-5 6.6c-2.9-1-5-3.4-5-6.6v-4.2z" fill="none" stroke="#34D399" stroke-width="1.3" stroke-linejoin="round"/><path d="M688.7333333333333 268.46000000000004l2 2 3.4-3.6" fill="none" stroke="#34D399" stroke-width="1.5" stroke-linecap="round"/><text x="705.3" y="274.6" font-size="16.0" font-weight="600" fill="#E8EEF6" letter-spacing="-0.1">2 · A second, independent reading</text><text x="683.3" y="297.1" font-size="13.0" font-weight="400" fill="#9FB0C3">The structural denominator comes from a different XML stack that imports no parser code,</text><text x="683.3" y="314.7" font-size="13.0" font-weight="400" fill="#9FB0C3">so a defect cannot be common to both.</text></g><g data-name="card:3 · The rules are hashed too" data-role="trust" data-level="primary"><rect x="1278.6666666666667" y="247.46" width="585.3333333333334" height="85.62" rx="10" fill="#0E141C" filter="url(#glow-trust)"/><rect x="1278.6666666666667" y="247.46" width="585.3333333333334" height="85.62" rx="10" fill="rgba(7,10,15,0.720)" filter="url(#cardshadow)"/><rect x="1278.6666666666667" y="247.46" width="585.3333333333334" height="85.62" rx="10" fill="url(#glass-trust)" stroke="rgba(52,211,153,0.620)" stroke-width="2.0"/><path d="M1288.6666666666667 248.36H1854.0" stroke="rgba(255,255,255,0.110)" stroke-width="1" fill="none"/><polygon points="1854.0,247.46 1864.0,247.46 1864.0,257.46000000000004" fill="#34D399" opacity="0.9"/><path d="M1302.6666666666667 262.46000000000004l5 2v4.2c0 3.2-2.1 5.6-5 6.6c-2.9-1-5-3.4-5-6.6v-4.2z" fill="none" stroke="#34D399" stroke-width="1.3" stroke-linejoin="round"/><path d="M1300.0666666666668 268.46000000000004l2 2 3.4-3.6" fill="none" stroke="#34D399" stroke-width="1.5" stroke-linecap="round"/><text x="1316.7" y="274.6" font-size="16.0" font-weight="600" fill="#E8EEF6" letter-spacing="-0.1">3 · The rules are hashed too</text><text x="1294.7" y="297.1" font-size="13.0" font-weight="400" fill="#9FB0C3">Every generation records digests over the parser, the reference extractor and the registry. A</text><text x="1294.7" y="314.7" font-size="13.0" font-weight="400" fill="#9FB0C3">byte change is a rule change.</text></g><g data-name="card:4 · The prover proves itself" data-role="trust" data-level="primary"><rect x="56" y="363.08000000000004" width="585.3333333333334" height="85.62" rx="10" fill="#0E141C" filter="url(#glow-trust)"/><rect x="56" y="363.08000000000004" width="585.3333333333334" height="85.62" rx="10" fill="rgba(7,10,15,0.720)" filter="url(#cardshadow)"/><rect x="56" y="363.08000000000004" width="585.3333333333334" height="85.62" rx="10" fill="url(#glass-trust)" stroke="rgba(52,211,153,0.620)" stroke-width="2.0"/><path d="M66 363.98H631.3333333333334" stroke="rgba(255,255,255,0.110)" stroke-width="1" fill="none"/><polygon points="631.3333333333334,363.08000000000004 641.3333333333334,363.08000000000004 641.3333333333334,373.08000000000004" fill="#34D399" opacity="0.9"/><path d="M80 378.08000000000004l5 2v4.2c0 3.2-2.1 5.6-5 6.6c-2.9-1-5-3.4-5-6.6v-4.2z" fill="none" stroke="#34D399" stroke-width="1.3" stroke-linejoin="round"/><path d="M77.4 384.08000000000004l2 2 3.4-3.6" fill="none" stroke="#34D399" stroke-width="1.5" stroke-linecap="round"/><text x="94.0" y="390.2" font-size="16.0" font-weight="600" fill="#E8EEF6" letter-spacing="-0.1">4 · The prover proves itself</text><text x="72.0" y="412.7" font-size="13.0" font-weight="400" fill="#9FB0C3">If any already-certified law stops reproducing under today's rules, no law gets a verdict —</text><text x="72.0" y="430.3" font-size="13.0" font-weight="400" fill="#9FB0C3">including the one being certified.</text></g><g data-name="card:5 · Fourteen gates, none hidden" data-role="trust" data-level="primary"><rect x="667.3333333333334" y="363.08000000000004" width="585.3333333333334" height="85.62" rx="10" fill="#0E141C" filter="url(#glow-trust)"/><rect x="667.3333333333334" y="363.08000000000004" width="585.3333333333334" height="85.62" rx="10" fill="rgba(7,10,15,0.720)" filter="url(#cardshadow)"/><rect x="667.3333333333334" y="363.08000000000004" width="585.3333333333334" height="85.62" rx="10" fill="url(#glass-trust)" stroke="rgba(52,211,153,0.620)" stroke-width="2.0"/><path d="M677.3333333333334 363.98H1242.6666666666667" stroke="rgba(255,255,255,0.110)" stroke-width="1" fill="none"/><polygon points="1242.6666666666667,363.08000000000004 1252.6666666666667,363.08000000000004 1252.6666666666667,373.08000000000004" fill="#34D399" opacity="0.9"/><path d="M691.3333333333334 378.08000000000004l5 2v4.2c0 3.2-2.1 5.6-5 6.6c-2.9-1-5-3.4-5-6.6v-4.2z" fill="none" stroke="#34D399" stroke-width="1.3" stroke-linejoin="round"/><path d="M688.7333333333333 384.08000000000004l2 2 3.4-3.6" fill="none" stroke="#34D399" stroke-width="1.5" stroke-linecap="round"/><text x="705.3" y="390.2" font-size="16.0" font-weight="600" fill="#E8EEF6" letter-spacing="-0.1">5 · Fourteen gates, none hidden</text><text x="683.3" y="412.7" font-size="13.0" font-weight="400" fill="#9FB0C3">Seven are required for the badge; all fourteen are recorded and displayed. A measurement</text><text x="683.3" y="430.3" font-size="13.0" font-weight="400" fill="#9FB0C3">nobody can see is not a measurement.</text></g><g data-name="card:6 · Four answers, never one badge" data-role="ui" data-level="primary"><rect x="1278.6666666666667" y="363.08000000000004" width="585.3333333333334" height="85.62" rx="10" fill="#0E141C" filter="url(#glow-ui)"/><rect x="1278.6666666666667" y="363.08000000000004" width="585.3333333333334" height="85.62" rx="10" fill="rgba(7,10,15,0.720)" filter="url(#cardshadow)"/><rect x="1278.6666666666667" y="363.08000000000004" width="585.3333333333334" height="85.62" rx="10" fill="url(#glass-ui)" stroke="rgba(96,165,250,0.620)" stroke-width="2.0"/><path d="M1288.6666666666667 363.98H1854.0" stroke="rgba(255,255,255,0.110)" stroke-width="1" fill="none"/><polygon points="1854.0,363.08000000000004 1864.0,363.08000000000004 1864.0,373.08000000000004" fill="#60A5FA" opacity="0.9"/><rect x="1296.6666666666667" y="379.08000000000004" width="12" height="10" rx="1.8" fill="none" stroke="#60A5FA" stroke-width="1.3"/><line x1="1296.6666666666667" y1="382.08000000000004" x2="1308.6666666666667" y2="382.08000000000004" stroke="#60A5FA" stroke-width="1.3"/><circle cx="1298.8666666666668" cy="380.58000000000004" r="0.8" fill="#60A5FA"/><text x="1316.7" y="390.2" font-size="16.0" font-weight="600" fill="#E8EEF6" letter-spacing="-0.1">6 · Four answers, never one badge</text><text x="1294.7" y="412.7" font-size="13.0" font-weight="400" fill="#9FB0C3">Verification status, verdict freshness, source currency and live store integrity stay separate,</text><text x="1294.7" y="430.3" font-size="13.0" font-weight="400" fill="#9FB0C3">so a green summary cannot hide which one failed.</text></g><g data-name="edge:sync:unlabelled"><path d="M646.3 290.3 L659.3 290.3 L659.3 290.3 L672.3 290.3" fill="none" stroke="rgba(52,211,153,0.850)" stroke-width="1.4" marker-end="url(#ah-trust-solid)" stroke-linecap="round"/></g><g data-name="edge:sync:unlabelled"><path d="M1257.7 290.3 L1270.7 290.3 L1270.7 290.3 L1283.7 290.3" fill="none" stroke="rgba(52,211,153,0.850)" stroke-width="1.4" marker-end="url(#ah-trust-solid)" stroke-linecap="round"/></g><g data-name="edge:sync:unlabelled"><path d="M646.3 405.9 L659.3 405.9 L659.3 405.9 L672.3 405.9" fill="none" stroke="rgba(52,211,153,0.850)" stroke-width="1.4" marker-end="url(#ah-trust-solid)" stroke-linecap="round"/></g><g data-name="edge:sync:unlabelled"><path d="M1257.7 405.9 L1270.7 405.9 L1270.7 405.9 L1283.7 405.9" fill="none" stroke="rgba(52,211,153,0.850)" stroke-width="1.4" marker-end="url(#ah-trust-solid)" stroke-linecap="round"/></g><g data-name="edge:sync:unlabelled"><path d="M1571.3 337.1 L1571.3 342.6 Q1571.3 348.1 1565.8 348.1 L356.7 348.1 Q348.7 348.1 348.7 356.1 L348.7 367.1" fill="none" stroke="rgba(52,211,153,0.850)" stroke-width="1.4" marker-end="url(#ah-trust-solid)" stroke-linecap="round"/></g><g data-name="note"><rect x="56" y="496.70000000000005" width="2.5" height="63.5" rx="1.2" fill="rgba(248,113,113,0.850)"/><text x="70.0" y="508.7" font-size="12.0" font-weight="600" fill="rgba(248,113,113,0.950)" letter-spacing="1.4">WHAT THIS DOES NOT CLAIM</text><text x="70.0" y="528.7" font-size="12.5" font-weight="400" fill="#9FB0C3">And the two limits that travel with it: a count matching is not proof — a citation misread onto a provision that does exist moves no count and fails no gate — and COMPLETE is machine structural assurance, not legal review. No law in the corpus is human-certified.</text><text x="70.0" y="546.5" font-size="12.5" font-weight="400" fill="#9FB0C3">The full gate inventory, the verdict pipeline and the three operations are in diagram 06.</text></g><g data-name="legend"><text x="56.0" y="600.2" font-size="12.0" font-weight="600" fill="#667B91" letter-spacing="1.4">ROLE</text><circle cx="115" cy="596.2" r="4.6" fill="#A78BFA" opacity="0.92"/><text x="125.0" y="600.2" font-size="12.0" font-weight="500" fill="#9FB0C3" letter-spacing="0.3">External source</text><circle cx="246.66528" cy="596.2" r="4.6" fill="#34D399" opacity="0.92"/><text x="256.7" y="600.2" font-size="12.0" font-weight="500" fill="#9FB0C3" letter-spacing="0.3">Verification / trust</text><circle cx="394.88912" cy="596.2" r="4.6" fill="#60A5FA" opacity="0.92"/><text x="404.9" y="600.2" font-size="12.0" font-weight="500" fill="#9FB0C3" letter-spacing="0.3">Operator / API</text><text x="56.0" y="622.2" font-size="12.0" font-weight="600" fill="#667B91" letter-spacing="1.4">FLOW</text><line x1="110" y1="618.2" x2="136" y2="618.2" stroke="#667B91" stroke-width="1.4"/><text x="144.0" y="622.2" font-size="12.0" font-weight="500" fill="#9FB0C3" letter-spacing="0.3">synchronous request</text><text x="56.0" y="644.2" font-size="12.0" font-weight="600" fill="#667B91" letter-spacing="1.4">AUTHORSHIP</text><rect x="160" y="633.2" width="15" height="13" rx="3" fill="rgba(232,238,246,0.050)" stroke="#667B91" stroke-width="2.0"/><polygon points="168,633.2 175,633.2 175,640.2 " fill="#9FB0C3"/><text x="183.0" y="644.2" font-size="12.0" font-weight="500" fill="#9FB0C3" letter-spacing="0.3">Primary implementation</text></g></svg>