<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="887" viewBox="0 0 1920 887" role="img" aria-label="The states a law actually occupies" font-family='Inter, "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif'><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16202C" stroke-width="1" stroke-opacity="0.5"/></pattern><pattern id="grid-coarse" width="200" height="200" patternUnits="userSpaceOnUse"><path d="M200 0H0V200" fill="none" stroke="#16202C" stroke-width="1.4" stroke-opacity="0.9"/></pattern><radialGradient id="vignette" cx="50%" cy="120%" r="120%"><stop offset="0%" stop-color="rgba(0,0,0,0.340)"/><stop offset="55%" stop-color="rgba(0,0,0,0.100)"/><stop offset="100%" stop-color="rgba(0,0,0,0.000)"/></radialGradient><radialGradient id="aurora-a" cx="8%" cy="-6%" r="62%"><stop offset="0%" stop-color="rgba(96,165,250,0.130)"/><stop offset="100%" stop-color="rgba(96,165,250,0.000)"/></radialGradient><radialGradient id="aurora-b" cx="96%" cy="4%" r="58%"><stop offset="0%" stop-color="rgba(52,211,153,0.100)"/><stop offset="100%" stop-color="rgba(52,211,153,0.000)"/></radialGradient><linearGradient id="topsheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="rgba(96,165,250,0.000)"/><stop offset="22%" stop-color="rgba(96,165,250,0.450)"/><stop offset="52%" stop-color="rgba(52,211,153,0.400)"/><stop offset="78%" stop-color="rgba(129,140,248,0.350)"/><stop offset="100%" stop-color="rgba(129,140,248,0.000)"/></linearGradient><marker id="ah-event-solid" markerWidth="11.0" markerHeight="9.0" refX="9.0" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9.0 3.5 L0 7.0 Z" fill="rgba(34,211,238,0.950)"/></marker><marker id="ah-trust-solid" markerWidth="11.0" markerHeight="9.0" refX="9.0" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9.0 3.5 L0 7.0 Z" fill="rgba(52,211,153,0.950)"/></marker><marker id="ah-warn-bar" markerWidth="11.0" markerHeight="9.0" refX="9.0" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><rect x="1" y="0.6" width="2.6" height="5.8" fill="rgba(248,113,113,0.950)"/></marker><marker id="ah-warn-solid" markerWidth="11.0" markerHeight="9.0" refX="9.0" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9.0 3.5 L0 7.0 Z" fill="rgba(248,113,113,0.950)"/></marker><marker id="ah-neutral-solid" markerWidth="11.0" markerHeight="9.0" refX="9.0" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9.0 3.5 L0 7.0 Z" fill="rgba(125,139,156,0.950)"/></marker><marker id="ah-ui-solid" markerWidth="11.0" markerHeight="9.0" refX="9.0" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9.0 3.5 L0 7.0 Z" fill="rgba(96,165,250,0.950)"/></marker></defs><g data-name="background"><rect width="1920" height="887" fill="#070A0F"/><rect width="1920" height="887" fill="url(#grid-coarse)" opacity="0.5"/><rect width="1920" height="887" fill="url(#grid)" opacity="0.38"/><rect width="1920" height="887" fill="url(#aurora-a)"/><rect width="1920" height="887" fill="url(#aurora-b)"/><rect width="1920" height="887" fill="url(#vignette)"/><rect width="1920" height="2" fill="url(#topsheen)"/></g><g data-name="header"><text x="56.0" y="68.0" font-size="12.0" font-weight="600" fill="#60A5FA" letter-spacing="1.4">STATE MODEL</text><text x="56.0" y="109.0" font-size="34.0" font-weight="600" fill="#E8EEF6" letter-spacing="-0.4">The states a law actually occupies</text><text x="56.0" y="140.0" font-size="17.0" font-weight="400" fill="#9FB0C3">Reconstructed from the technical states, event boundaries, gate verdicts and lifecycle columns that exist in code — not from a generic lifecycle template.</text><line x1="56" y1="169.46" x2="1864" y2="169.46" stroke="#1C2736" stroke-width="1"/></g><g data-name="byline"><text x="1864.0" y="70.0" font-size="12.0" font-weight="500" fill="#9FB0C3" letter-spacing="0.3" text-anchor="end">Mohd Zamin Quadri</text><text x="1864.0" y="88.0" font-size="11.5" font-weight="400" fill="#667B91" text-anchor="end">AI Engineer · BP-ITCS</text></g><g data-name="state:REGISTERED" data-role="source"><rect x="56" y="255.46" width="250" height="84.34" rx="10" fill="rgba(167,139,250,0.130)" stroke="rgba(167,139,250,0.650)" stroke-width="1.6"/><text x="181.0" y="283.0" font-size="16.0" font-weight="600" fill="#E8EEF6" letter-spacing="-0.1" text-anchor="middle">REGISTERED</text><text x="181.0" y="306.5" font-size="11.5" font-weight="400" fill="#9FB0C3" text-anchor="middle">in law_registry.yaml; may be ingestible:</text><text x="181.0" y="321.9" font-size="11.5" font-weight="400" fill="#9FB0C3" text-anchor="middle">false</text></g><g data-name="state:CAPTURED" data-role="event"><rect x="380" y="255.46" width="250" height="68.92999999999999" rx="10" fill="rgba(34,211,238,0.130)" stroke="rgba(34,211,238,0.650)" stroke-width="1.6"/><text x="505.0" y="283.0" font-size="16.0" font-weight="600" fill="#E8EEF6" letter-spacing="-0.1" text-anchor="middle">CAPTURED</text><text x="505.0" y="306.5" font-size="11.5" font-weight="400" fill="#9FB0C3" text-anchor="middle">bytes in MinIO, SHA-256 recorded</text></g><g data-name="state:STRUCTURED" data-role="store"><rect x="704" y="255.46" width="250" height="68.92999999999999" rx="10" fill="rgba(240,180,41,0.130)" stroke="rgba(240,180,41,0.650)" stroke-width="1.6"/><text x="829.0" y="283.0" font-size="16.0" font-weight="600" fill="#E8EEF6" letter-spacing="-0.1" text-anchor="middle">STRUCTURED</text><text x="829.0" y="306.5" font-size="11.5" font-weight="400" fill="#9FB0C3" text-anchor="middle">canonical PostgreSQL committed</text></g><g data-name="state:EMBEDDED" data-role="ai"><rect x="1028" y="255.46" width="250" height="84.34" rx="10" fill="rgba(129,140,248,0.130)" stroke="rgba(129,140,248,0.650)" stroke-width="1.6"/><text x="1153.0" y="283.0" font-size="16.0" font-weight="600" fill="#E8EEF6" letter-spacing="-0.1" text-anchor="middle">EMBEDDED</text><text x="1153.0" y="306.5" font-size="11.5" font-weight="400" fill="#9FB0C3" text-anchor="middle">Qdrant and Neo4j converged, fences</text><text x="1153.0" y="321.9" font-size="11.5" font-weight="400" fill="#9FB0C3" text-anchor="middle">passed</text></g><g data-name="state:MEASURED" data-role="ui"><rect x="1352" y="255.46" width="250" height="68.92999999999999" rx="10" fill="rgba(96,165,250,0.130)" stroke="rgba(96,165,250,0.650)" stroke-width="1.6"/><text x="1477.0" y="283.0" font-size="16.0" font-weight="600" fill="#E8EEF6" letter-spacing="-0.1" text-anchor="middle">MEASURED</text><text x="1477.0" y="306.5" font-size="11.5" font-weight="400" fill="#9FB0C3" text-anchor="middle">every applicable gate has a verdict</text></g><g data-name="state:BLOCKED" data-role="warn"><rect x="52" y="431.8" width="258" height="76.92999999999999" rx="14" fill="none" stroke="rgba(248,113,113,0.300)" stroke-width="1"/><rect x="56" y="435.8" width="250" height="68.92999999999999" rx="10" fill="rgba(248,113,113,0.130)" stroke="rgba(248,113,113,0.650)" stroke-width="1.6"/><text x="181.0" y="463.3" font-size="16.0" font-weight="600" fill="#E8EEF6" letter-spacing="-0.1" text-anchor="middle">BLOCKED</text><text x="181.0" y="486.8" font-size="11.5" font-weight="400" fill="#9FB0C3" text-anchor="middle">pre-flight refused it; never ingested</text></g><g data-name="state:INTEGRITY FAILED" data-role="warn"><rect x="704" y="435.8" width="250" height="68.92999999999999" rx="10" fill="rgba(248,113,113,0.130)" stroke="rgba(248,113,113,0.650)" stroke-width="1.6"/><text x="829.0" y="463.3" font-size="16.0" font-weight="600" fill="#E8EEF6" letter-spacing="-0.1" text-anchor="middle">INTEGRITY FAILED</text><text x="829.0" y="486.8" font-size="11.5" font-weight="400" fill="#9FB0C3" text-anchor="middle">a required gate failed</text></g><g data-name="state:SOURCE CHANGED" data-role="warn"><rect x="1028" y="435.8" width="250" height="68.92999999999999" rx="10" fill="rgba(248,113,113,0.130)" stroke="rgba(248,113,113,0.650)" stroke-width="1.6"/><text x="1153.0" y="463.3" font-size="16.0" font-weight="600" fill="#E8EEF6" letter-spacing="-0.1" text-anchor="middle">SOURCE CHANGED</text><text x="1153.0" y="486.8" font-size="11.5" font-weight="400" fill="#9FB0C3" text-anchor="middle">the publisher has moved on</text></g><g data-name="state:VERIFIED" data-role="trust"><rect x="1348" y="431.8" width="258" height="76.92999999999999" rx="14" fill="none" stroke="rgba(52,211,153,0.300)" stroke-width="1"/><rect x="1352" y="435.8" width="250" height="68.92999999999999" rx="10" fill="rgba(52,211,153,0.130)" stroke="rgba(52,211,153,0.650)" stroke-width="1.6"/><text x="1477.0" y="463.3" font-size="16.0" font-weight="600" fill="#E8EEF6" letter-spacing="-0.1" text-anchor="middle">VERIFIED</text><text x="1477.0" y="486.8" font-size="11.5" font-weight="400" fill="#9FB0C3" text-anchor="middle">all required gates pass; currency valid</text></g><g data-name="state:WITHDRAWN" data-role="neutral"><rect x="1348" y="544.73" width="258" height="76.92999999999999" rx="14" fill="none" stroke="rgba(125,139,156,0.300)" stroke-width="1"/><rect x="1352" y="548.73" width="250" height="68.92999999999999" rx="10" fill="rgba(125,139,156,0.130)" stroke="rgba(125,139,156,0.650)" stroke-width="1.6"/><text x="1477.0" y="576.2" font-size="16.0" font-weight="600" fill="#E8EEF6" letter-spacing="-0.1" text-anchor="middle">WITHDRAWN</text><text x="1477.0" y="599.8" font-size="11.5" font-weight="400" fill="#9FB0C3" text-anchor="middle">withdrawn_at set; evidence retained</text></g><g data-name="edge:sync:capture"><path d="M311.0 297.6 L344.1 297.6 Q348.0 297.6 348.0 293.8 L348.0 293.8 Q348.0 289.9 351.9 289.9 L385.0 289.9" fill="none" stroke="rgba(34,211,238,0.850)" stroke-width="1.4" marker-end="url(#ah-event-solid)" stroke-linecap="round"/><rect x="320.0" y="282.8" width="56.0" height="19" rx="5" fill="#070A0F" stroke="#1C2736" stroke-width="0.8"/><text x="348.0" y="297.0" font-size="11.5" font-weight="500" fill="#9FB0C3" letter-spacing="0.2" text-anchor="middle">capture</text></g><g data-name="edge:async:events.inbound"><path d="M635.0 289.9 L672.0 289.9 L672.0 289.9 L709.0 289.9" fill="none" stroke="rgba(34,211,238,0.850)" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#ah-event-solid)" stroke-linecap="round"/><rect x="614.6" y="278.9" width="114.8" height="19" rx="5" fill="#070A0F" stroke="#1C2736" stroke-width="0.8"/><text x="672.0" y="293.1" font-size="12.0" font-weight="400" fill="rgba(34,211,238,0.950)" font-family='"JetBrains Mono", "Cascadia Code", Consolas, "SF Mono", Menlo, monospace' text-anchor="middle">events.inbound</text></g><g data-name="edge:async:law.structured"><path d="M959.0 289.9 L992.1 289.9 Q996.0 289.9 996.0 293.8 L996.0 293.8 Q996.0 297.6 999.9 297.6 L1033.0 297.6" fill="none" stroke="rgba(34,211,238,0.850)" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#ah-event-solid)" stroke-linecap="round"/><rect x="938.6" y="282.8" width="114.8" height="19" rx="5" fill="#070A0F" stroke="#1C2736" stroke-width="0.8"/><text x="996.0" y="297.0" font-size="12.0" font-weight="400" fill="rgba(34,211,238,0.950)" font-family='"JetBrains Mono", "Cascadia Code", Consolas, "SF Mono", Menlo, monospace' text-anchor="middle">law.structured</text></g><g data-name="edge:async:law.embedded"><path d="M1283.0 297.6 L1316.1 297.6 Q1320.0 297.6 1320.0 293.8 L1320.0 293.8 Q1320.0 289.9 1323.9 289.9 L1357.0 289.9" fill="none" stroke="rgba(52,211,153,0.850)" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#ah-trust-solid)" stroke-linecap="round"/><rect x="1269.8" y="282.8" width="100.4" height="19" rx="5" fill="#070A0F" stroke="#1C2736" stroke-width="0.8"/><text x="1320.0" y="297.0" font-size="12.0" font-weight="400" fill="rgba(52,211,153,0.950)" font-family='"JetBrains Mono", "Cascadia Code", Consolas, "SF Mono", Menlo, monospace' text-anchor="middle">law.embedded</text></g><g data-name="edge:blocked:pre-flight"><path d="M181.0 344.8 L181.0 392.8 L181.0 392.8 L181.0 440.8" fill="none" stroke="rgba(248,113,113,0.850)" stroke-width="1.4" marker-end="url(#ah-warn-bar)" stroke-linecap="round"/><rect x="148.7" y="381.8" width="64.7" height="19" rx="5" fill="#070A0F" stroke="#1C2736" stroke-width="0.8"/><text x="181.0" y="396.0" font-size="11.5" font-weight="500" fill="#9FB0C3" letter-spacing="0.2" text-anchor="middle">pre-flight</text></g><g data-name="edge:sync:all pass"><path d="M1477.0 329.4 L1477.0 385.1 L1477.0 385.1 L1477.0 440.8" fill="none" stroke="rgba(52,211,153,0.850)" stroke-width="1.4" marker-end="url(#ah-trust-solid)" stroke-linecap="round"/><rect x="1449.3" y="374.1" width="55.4" height="19" rx="5" fill="#070A0F" stroke="#1C2736" stroke-width="0.8"/><text x="1477.0" y="388.3" font-size="11.5" font-weight="500" fill="#9FB0C3" letter-spacing="0.2" text-anchor="middle">all pass</text></g><g data-name="edge:sync:unlabelled"><path d="M1439.5 329.4 L1439.5 397.8 Q1439.5 405.8 1431.5 405.8 L1186.0 405.8 Q1178.0 405.8 1178.0 413.8 L1178.0 440.8" fill="none" stroke="rgba(248,113,113,0.850)" stroke-width="1.4" marker-end="url(#ah-warn-solid)" stroke-linecap="round"/></g><g data-name="edge:sync:unlabelled"><path d="M1402.0 329.4 L1402.0 379.8 Q1402.0 387.8 1394.0 387.8 L849.5 387.8 Q841.5 387.8 841.5 395.8 L841.5 440.8" fill="none" stroke="rgba(248,113,113,0.850)" stroke-width="1.4" marker-end="url(#ah-warn-solid)" stroke-linecap="round"/></g><g data-name="edge:sync:withdraw"><path d="M1477.0 509.7 L1477.0 531.7 L1477.0 531.7 L1477.0 553.7" fill="none" stroke="rgba(125,139,156,0.850)" stroke-width="1.4" marker-end="url(#ah-neutral-solid)" stroke-linecap="round"/><rect x="1444.4" y="520.7" width="65.2" height="19" rx="5" fill="#070A0F" stroke="#1C2736" stroke-width="0.8"/><text x="1477.0" y="534.9" font-size="11.5" font-weight="500" fill="#9FB0C3" letter-spacing="0.2" text-anchor="middle">withdraw</text></g><g data-name="edge:sync:re-ingest"><path d="M1065.5 430.8 L1065.5 377.8 Q1065.5 369.8 1057.5 369.8 L568.0 369.8 Q560.0 369.8 560.0 361.8 L560.0 319.4" fill="none" stroke="rgba(96,165,250,0.850)" stroke-width="1.4" marker-end="url(#ah-ui-solid)" stroke-linecap="round"/><rect x="786.5" y="358.8" width="63.1" height="19" rx="5" fill="#070A0F" stroke="#1C2736" stroke-width="0.8"/><text x="818.0" y="373.0" font-size="11.5" font-weight="500" fill="#9FB0C3" letter-spacing="0.2" text-anchor="middle">re-ingest</text></g><g data-name="edge:sync:unlabelled"><path d="M741.5 430.8 L741.5 363.8 Q741.5 355.8 733.5 355.8 L488.0 355.8 Q480.0 355.8 480.0 347.8 L480.0 319.4" fill="none" stroke="rgba(96,165,250,0.850)" stroke-width="1.4" marker-end="url(#ah-ui-solid)" stroke-linecap="round"/></g><g data-name="note"><rect x="56" y="657.66" width="2.5" height="81.25" rx="1.2" fill="rgba(52,211,153,0.850)"/><text x="70.0" y="669.7" font-size="12.0" font-weight="600" fill="rgba(52,211,153,0.950)" letter-spacing="1.4">WHERE THESE STATES LIVE</text><text x="70.0" y="689.7" font-size="12.5" font-weight="400" fill="#9FB0C3">Two of these are not derived from a status column, and that is the interesting part. EMBEDDED exists because the loader publishes an event only after</text><text x="70.0" y="707.4" font-size="12.5" font-weight="400" fill="#9FB0C3">both count fences pass, and MEASURED exists because the preprocessor consumes that event and runs the gates unasked.</text><text x="70.0" y="725.2" font-size="12.5" font-weight="400" fill="#9FB0C3">So the state model is enforced by the event contract rather than by a field somebody has to remember to set.</text></g><g data-name="note"><rect x="970.0" y="657.66" width="2.5" height="99.0" rx="1.2" fill="rgba(125,139,156,0.850)"/><text x="984.0" y="669.7" font-size="12.0" font-weight="600" fill="rgba(125,139,156,0.950)" letter-spacing="1.4">WITHDRAWN IS NOT DELETED</text><text x="984.0" y="689.7" font-size="12.5" font-weight="400" fill="#9FB0C3">WITHDRAWN is not deletion. The laws row survives, withdrawn_at is set, and every piece of evidence — MinIO objects, raw documents, publisher</text><text x="984.0" y="707.4" font-size="12.5" font-weight="400" fill="#9FB0C3">captures, currency observations, verification checks — is untouched.</text><text x="984.0" y="725.2" font-size="12.5" font-weight="400" fill="#9FB0C3">A law leaving the corpus does not make the record of what its publisher served untrue. That sentence is in the source, and it is why withdrawal and</text><text x="984.0" y="742.9" font-size="12.5" font-weight="400" fill="#9FB0C3">deletion are different operations.</text></g><g data-name="legend"><text x="56.0" y="802.9" font-size="12.0" font-weight="600" fill="#667B91" letter-spacing="1.4">ROLE</text><circle cx="115" cy="798.91" r="4.6" fill="#A78BFA" opacity="0.92"/><text x="125.0" y="802.9" font-size="12.0" font-weight="500" fill="#9FB0C3" letter-spacing="0.3">External source</text><circle cx="246.66528" cy="798.91" r="4.6" fill="#22D3EE" opacity="0.92"/><text x="256.7" y="802.9" font-size="12.0" font-weight="500" fill="#9FB0C3" letter-spacing="0.3">Event / transport</text><circle cx="387.06703999999996" cy="798.91" r="4.6" fill="#818CF8" opacity="0.92"/><text x="397.1" y="802.9" font-size="12.0" font-weight="500" fill="#9FB0C3" letter-spacing="0.3">AI / ML</text><circle cx="469.57791999999995" cy="798.91" r="4.6" fill="#F0B429" opacity="0.92"/><text x="479.6" y="802.9" font-size="12.0" font-weight="500" fill="#9FB0C3" letter-spacing="0.3">Persistence</text><circle cx="578.54832" cy="798.91" r="4.6" fill="#34D399" opacity="0.92"/><text x="588.5" y="802.9" font-size="12.0" font-weight="500" fill="#9FB0C3" letter-spacing="0.3">Verification / trust</text><circle cx="726.77216" cy="798.91" r="4.6" fill="#60A5FA" opacity="0.92"/><text x="736.8" y="802.9" font-size="12.0" font-weight="500" fill="#9FB0C3" letter-spacing="0.3">Operator / API</text><circle cx="852.18688" cy="798.91" r="4.6" fill="#F87171" opacity="0.92"/><text x="862.2" y="802.9" font-size="12.0" font-weight="500" fill="#9FB0C3" letter-spacing="0.3">Failure path</text><text x="56.0" y="824.9" font-size="12.0" font-weight="600" fill="#667B91" letter-spacing="1.4">FLOW</text><line x1="110" y1="820.91" x2="136" y2="820.91" stroke="#667B91" stroke-width="1.4"/><text x="144.0" y="824.9" font-size="12.0" font-weight="500" fill="#9FB0C3" letter-spacing="0.3">synchronous request</text><line x1="292.10384" y1="820.91" x2="318.10384" y2="820.91" stroke="#667B91" stroke-width="1.4" stroke-dasharray="6 5"/><text x="326.1" y="824.9" font-size="12.0" font-weight="500" fill="#9FB0C3" letter-spacing="0.3">asynchronous event</text><line x1="469.17152" y1="820.91" x2="495.17152" y2="820.91" stroke="#667B91" stroke-width="1.4"/><text x="503.2" y="824.9" font-size="12.0" font-weight="500" fill="#9FB0C3" letter-spacing="0.3">refused / blocked</text></g></svg>