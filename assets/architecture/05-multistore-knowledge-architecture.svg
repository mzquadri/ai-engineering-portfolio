<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="851" viewBox="0 0 1920 851" role="img" aria-label="Four stores, four jobs, one writer each" font-family='Inter, "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif'><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16202C" stroke-width="1" stroke-opacity="0.5"/></pattern><pattern id="grid-coarse" width="200" height="200" patternUnits="userSpaceOnUse"><path d="M200 0H0V200" fill="none" stroke="#16202C" stroke-width="1.4" stroke-opacity="0.9"/></pattern><radialGradient id="vignette" cx="50%" cy="120%" r="120%"><stop offset="0%" stop-color="rgba(0,0,0,0.340)"/><stop offset="55%" stop-color="rgba(0,0,0,0.100)"/><stop offset="100%" stop-color="rgba(0,0,0,0.000)"/></radialGradient><radialGradient id="aurora-a" cx="8%" cy="-6%" r="62%"><stop offset="0%" stop-color="rgba(96,165,250,0.130)"/><stop offset="100%" stop-color="rgba(96,165,250,0.000)"/></radialGradient><radialGradient id="aurora-b" cx="96%" cy="4%" r="58%"><stop offset="0%" stop-color="rgba(52,211,153,0.100)"/><stop offset="100%" stop-color="rgba(52,211,153,0.000)"/></radialGradient><linearGradient id="topsheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="rgba(96,165,250,0.000)"/><stop offset="22%" stop-color="rgba(96,165,250,0.450)"/><stop offset="52%" stop-color="rgba(52,211,153,0.400)"/><stop offset="78%" stop-color="rgba(129,140,248,0.350)"/><stop offset="100%" stop-color="rgba(129,140,248,0.000)"/></linearGradient><linearGradient id="glass-store" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgba(240,180,41,0.190)"/><stop offset="55%" stop-color="rgba(240,180,41,0.095)"/><stop offset="100%" stop-color="rgba(240,180,41,0.050)"/></linearGradient><filter id="cardshadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#000000" flood-opacity="0.40"/></filter></defs><g data-name="background"><rect width="1920" height="851" fill="#070A0F"/><rect width="1920" height="851" fill="url(#grid-coarse)" opacity="0.5"/><rect width="1920" height="851" fill="url(#grid)" opacity="0.38"/><rect width="1920" height="851" fill="url(#aurora-a)"/><rect width="1920" height="851" fill="url(#aurora-b)"/><rect width="1920" height="851" fill="url(#vignette)"/><rect width="1920" height="2" fill="url(#topsheen)"/></g><g data-name="header"><text x="56.0" y="68.0" font-size="12.0" font-weight="600" fill="#60A5FA" letter-spacing="1.4">KNOWLEDGE STORAGE</text><text x="56.0" y="109.0" font-size="34.0" font-weight="600" fill="#E8EEF6" letter-spacing="-0.4">Four stores, four jobs, one writer each</text><text x="56.0" y="140.0" font-size="17.0" font-weight="400" fill="#9FB0C3">Each store is here because the others cannot do its job. The limitation row is the actual justification.</text><line x1="56" y1="169.46" x2="1864" y2="169.46" stroke="#1C2736" stroke-width="1"/></g><g data-name="byline"><text x="1864.0" y="70.0" font-size="12.0" font-weight="500" fill="#9FB0C3" letter-spacing="0.3" text-anchor="end">Mohd Zamin Quadri</text><text x="1864.0" y="88.0" font-size="11.5" font-weight="400" fill="#667B91" text-anchor="end">AI Engineer · BP-ITCS</text></g><g data-name="store:PostgreSQL" data-role="store" data-level="primary"><rect x="56.0" y="229.46" width="432.5" height="111.47" rx="10" fill="rgba(7,10,15,0.720)" filter="url(#cardshadow)"/><rect x="56.0" y="229.46" width="432.5" height="111.47" rx="10" fill="url(#glass-store)" stroke="rgba(240,180,41,0.660)" stroke-width="2.0"/><rect x="59.0" y="232.46" width="426.5" height="105.47" rx="7" fill="none" stroke="rgba(240,180,41,0.320)" stroke-width="1"/><path d="M66.0 230.36H478.5" stroke="rgba(255,255,255,0.100)" stroke-width="1" fill="none"/><polygon points="478.5,229.46 488.5,229.46 488.5,239.46" fill="#F0B429" opacity="0.9"/><ellipse cx="80.0" cy="246.46" rx="6.2" ry="2.4" fill="none" stroke="#F0B429" stroke-width="1.3"/><ellipse cx="80.0" cy="250.46" rx="6.2" ry="2.4" fill="none" stroke="#F0B429" stroke-width="1.3"/><ellipse cx="80.0" cy="254.46" rx="6.2" ry="2.4" fill="none" stroke="#F0B429" stroke-width="1.3"/><text x="94.0" y="256.6" font-size="16.0" font-weight="600" fill="#E8EEF6" letter-spacing="-0.1">PostgreSQL</text><text x="72.0" y="279.1" font-size="13.0" font-weight="400" fill="#9FB0C3">Canonical record</text><line x1="72.0" y1="301.65" x2="472.5" y2="301.65" stroke="#1C2736" stroke-width="1"/><text x="72.0" y="315.6" font-size="12.0" font-weight="400" fill="#667B91" font-family='"JetBrains Mono", "Cascadia Code", Consolas, "SF Mono", Menlo, monospace'>Sole writer: Preprocessor (corpus) · Health Service</text><text x="72.0" y="331.8" font-size="12.0" font-weight="400" fill="#667B91" font-family='"JetBrains Mono", "Cascadia Code", Consolas, "SF Mono", Menlo, monospace'>(currency)</text></g><text x="56.0" y="366.9" font-size="12.0" font-weight="600" fill="#667B91" letter-spacing="1.4">HOLDS</text><circle cx="60.0" cy="380.93" r="2" fill="rgba(240,180,41,0.850)"/><text x="68.0" y="384.9" font-size="11.5" font-weight="400" fill="#9FB0C3">Laws, versions, sections, chunks</text><circle cx="60.0" cy="402.34000000000003" r="2" fill="rgba(240,180,41,0.850)"/><text x="68.0" y="406.3" font-size="11.5" font-weight="400" fill="#9FB0C3">Citations and law-level references</text><circle cx="60.0" cy="423.75000000000006" r="2" fill="rgba(240,180,41,0.850)"/><text x="68.0" y="427.8" font-size="11.5" font-weight="400" fill="#9FB0C3">Source evidence, append-only</text><circle cx="60.0" cy="445.1600000000001" r="2" fill="rgba(240,180,41,0.850)"/><text x="68.0" y="449.2" font-size="11.5" font-weight="400" fill="#9FB0C3">Gate verdicts and ruleset provenance</text><circle cx="60.0" cy="466.5700000000001" r="2" fill="rgba(240,180,41,0.850)"/><text x="68.0" y="470.6" font-size="11.5" font-weight="400" fill="#9FB0C3">Currency observations and audit log</text><g data-name="note"><rect x="56.0" y="501.98000000000013" width="2.5" height="45.75" rx="1.2" fill="rgba(248,113,113,0.850)"/><text x="70.0" y="514.0" font-size="12.0" font-weight="600" fill="rgba(248,113,113,0.950)" letter-spacing="1.4">CANNOT</text><text x="70.0" y="534.0" font-size="12.5" font-weight="400" fill="#9FB0C3">Cannot search by meaning.</text></g><g data-name="note"><rect x="56.0" y="563.7300000000001" width="2.5" height="63.5" rx="1.2" fill="rgba(52,211,153,0.850)"/><text x="70.0" y="575.7" font-size="12.0" font-weight="600" fill="rgba(52,211,153,0.950)" letter-spacing="1.4">DESIGN CONSEQUENCE</text><text x="70.0" y="595.7" font-size="12.5" font-weight="400" fill="#9FB0C3">ON DELETE RESTRICT on currency_observations is why a wrong delete</text><text x="70.0" y="613.5" font-size="12.5" font-weight="400" fill="#9FB0C3">is impossible rather than discouraged.</text></g><g data-name="store:Qdrant" data-role="store" data-level="primary"><rect x="514.5" y="229.46" width="432.5" height="95.27" rx="10" fill="rgba(7,10,15,0.720)" filter="url(#cardshadow)"/><rect x="514.5" y="229.46" width="432.5" height="95.27" rx="10" fill="url(#glass-store)" stroke="rgba(240,180,41,0.660)" stroke-width="2.0"/><rect x="517.5" y="232.46" width="426.5" height="89.27" rx="7" fill="none" stroke="rgba(240,180,41,0.320)" stroke-width="1"/><path d="M524.5 230.36H937.0" stroke="rgba(255,255,255,0.100)" stroke-width="1" fill="none"/><polygon points="937.0,229.46 947.0,229.46 947.0,239.46" fill="#F0B429" opacity="0.9"/><circle cx="538.5" cy="245.46" r="1.7" fill="#F0B429"/><circle cx="533.5" cy="249.46" r="1.7" fill="#F0B429"/><circle cx="543.5" cy="248.46" r="1.7" fill="#F0B429"/><circle cx="535.5" cy="254.46" r="1.7" fill="#F0B429"/><circle cx="541.5" cy="254.46" r="1.7" fill="#F0B429"/><circle cx="538.5" cy="250.46" r="1.7" fill="#F0B429"/><text x="552.5" y="256.6" font-size="16.0" font-weight="600" fill="#E8EEF6" letter-spacing="-0.1">Qdrant</text><text x="530.5" y="279.1" font-size="13.0" font-weight="400" fill="#9FB0C3">Semantic retrieval</text><line x1="530.5" y1="301.65" x2="931.0" y2="301.65" stroke="#1C2736" stroke-width="1"/><text x="530.5" y="315.6" font-size="12.0" font-weight="400" fill="#667B91" font-family='"JetBrains Mono", "Cascadia Code", Consolas, "SF Mono", Menlo, monospace'>sole writer: loader</text></g><text x="514.5" y="350.7" font-size="12.0" font-weight="600" fill="#667B91" letter-spacing="1.4">HOLDS</text><circle cx="518.5" cy="364.73" r="2" fill="rgba(240,180,41,0.850)"/><text x="526.5" y="368.7" font-size="11.5" font-weight="400" fill="#9FB0C3">One point per chunk</text><circle cx="518.5" cy="386.14000000000004" r="2" fill="rgba(240,180,41,0.850)"/><text x="526.5" y="390.1" font-size="11.5" font-weight="400" fill="#9FB0C3">dense 1024, cosine, named dense</text><circle cx="518.5" cy="407.55000000000007" r="2" fill="rgba(240,180,41,0.850)"/><text x="526.5" y="411.6" font-size="11.5" font-weight="400" fill="#9FB0C3">sparse LEXICAL from the same model</text><circle cx="518.5" cy="428.9600000000001" r="2" fill="rgba(240,180,41,0.850)"/><text x="526.5" y="433.0" font-size="11.5" font-weight="400" fill="#9FB0C3">payload: law, section_number, title, raw_text</text><circle cx="518.5" cy="450.3700000000001" r="2" fill="rgba(240,180,41,0.850)"/><text x="526.5" y="454.4" font-size="11.5" font-weight="400" fill="#9FB0C3">RRF fusion server-side</text><g data-name="note"><rect x="514.5" y="485.78000000000014" width="2.5" height="45.75" rx="1.2" fill="rgba(248,113,113,0.850)"/><text x="528.5" y="497.8" font-size="12.0" font-weight="600" fill="rgba(248,113,113,0.950)" letter-spacing="1.4">CANNOT</text><text x="528.5" y="517.8" font-size="12.5" font-weight="400" fill="#9FB0C3">Cannot follow a citation chain, cannot enforce integrity.</text></g><g data-name="note"><rect x="514.5" y="547.5300000000002" width="2.5" height="63.5" rx="1.2" fill="rgba(52,211,153,0.850)"/><text x="528.5" y="559.5" font-size="12.0" font-weight="600" fill="rgba(52,211,153,0.950)" letter-spacing="1.4">DESIGN CONSEQUENCE</text><text x="528.5" y="579.5" font-size="12.5" font-weight="400" fill="#9FB0C3">Point id is uuid5(ns, chunk_id), so a re-run overwrites and never</text><text x="528.5" y="597.3" font-size="12.5" font-weight="400" fill="#9FB0C3">duplicates.</text></g><g data-name="store:Neo4j" data-role="store" data-level="primary"><rect x="973.0" y="229.46" width="432.5" height="95.27" rx="10" fill="rgba(7,10,15,0.720)" filter="url(#cardshadow)"/><rect x="973.0" y="229.46" width="432.5" height="95.27" rx="10" fill="url(#glass-store)" stroke="rgba(240,180,41,0.660)" stroke-width="2.0"/><rect x="976.0" y="232.46" width="426.5" height="89.27" rx="7" fill="none" stroke="rgba(240,180,41,0.320)" stroke-width="1"/><path d="M983.0 230.36H1395.5" stroke="rgba(255,255,255,0.100)" stroke-width="1" fill="none"/><polygon points="1395.5,229.46 1405.5,229.46 1405.5,239.46" fill="#F0B429" opacity="0.9"/><line x1="997.0" y1="245.46" x2="997.0" y2="250.46" stroke="#F0B429" stroke-width="1.3" stroke-opacity="0.75"/><line x1="992.0" y1="254.46" x2="997.0" y2="250.46" stroke="#F0B429" stroke-width="1.3" stroke-opacity="0.75"/><line x1="1002.0" y1="254.46" x2="997.0" y2="250.46" stroke="#F0B429" stroke-width="1.3" stroke-opacity="0.75"/><line x1="992.0" y1="254.46" x2="1002.0" y2="254.46" stroke="#F0B429" stroke-width="1.3" stroke-opacity="0.75"/><circle cx="997.0" cy="245.46" r="2.1" fill="#F0B429"/><circle cx="992.0" cy="254.46" r="2.1" fill="#F0B429"/><circle cx="1002.0" cy="254.46" r="2.1" fill="#F0B429"/><circle cx="997.0" cy="250.46" r="2.1" fill="#F0B429"/><text x="1011.0" y="256.6" font-size="16.0" font-weight="600" fill="#E8EEF6" letter-spacing="-0.1">Neo4j</text><text x="989.0" y="279.1" font-size="13.0" font-weight="400" fill="#9FB0C3">Reference traversal</text><line x1="989.0" y1="301.65" x2="1389.5" y2="301.65" stroke="#1C2736" stroke-width="1"/><text x="989.0" y="315.6" font-size="12.0" font-weight="400" fill="#667B91" font-family='"JetBrains Mono", "Cascadia Code", Consolas, "SF Mono", Menlo, monospace'>sole writer: loader</text></g><text x="973.0" y="350.7" font-size="12.0" font-weight="600" fill="#667B91" letter-spacing="1.4">HOLDS</text><circle cx="977.0" cy="364.73" r="2" fill="rgba(240,180,41,0.850)"/><text x="985.0" y="368.7" font-size="11.5" font-weight="400" fill="#9FB0C3">(:LawSection {id}) · (:Law {code})</text><circle cx="977.0" cy="386.14000000000004" r="2" fill="rgba(240,180,41,0.850)"/><text x="985.0" y="390.1" font-size="11.5" font-weight="400" fill="#9FB0C3">[:REFERS_TO] → LawSection</text><circle cx="977.0" cy="407.55000000000007" r="2" fill="rgba(240,180,41,0.850)"/><text x="985.0" y="411.6" font-size="11.5" font-weight="400" fill="#9FB0C3">[:CITES_LAW] → Law</text><circle cx="977.0" cy="428.9600000000001" r="2" fill="rgba(240,180,41,0.850)"/><text x="985.0" y="433.0" font-size="11.5" font-weight="400" fill="#9FB0C3">Stub nodes for cited-but-not-ingested</text><circle cx="977.0" cy="450.3700000000001" r="2" fill="rgba(240,180,41,0.850)"/><text x="985.0" y="454.4" font-size="11.5" font-weight="400" fill="#9FB0C3">MERGE by id; never recreated</text><g data-name="note"><rect x="973.0" y="485.78000000000014" width="2.5" height="45.75" rx="1.2" fill="rgba(248,113,113,0.850)"/><text x="987.0" y="497.8" font-size="12.0" font-weight="600" fill="rgba(248,113,113,0.950)" letter-spacing="1.4">CANNOT</text><text x="987.0" y="517.8" font-size="12.5" font-weight="400" fill="#9FB0C3">Cannot search by meaning.</text></g><g data-name="note"><rect x="973.0" y="547.5300000000002" width="2.5" height="63.5" rx="1.2" fill="rgba(52,211,153,0.850)"/><text x="987.0" y="559.5" font-size="12.0" font-weight="600" fill="rgba(52,211,153,0.950)" letter-spacing="1.4">DESIGN CONSEQUENCE</text><text x="987.0" y="579.5" font-size="12.5" font-weight="400" fill="#9FB0C3">A vector hit finds the matched provision. A compliance answer often</text><text x="987.0" y="597.3" font-size="12.5" font-weight="400" fill="#9FB0C3">needs the one it cites.</text></g><g data-name="store:MinIO" data-role="store" data-level="primary"><rect x="1431.5" y="229.46" width="432.5" height="111.47" rx="10" fill="rgba(7,10,15,0.720)" filter="url(#cardshadow)"/><rect x="1431.5" y="229.46" width="432.5" height="111.47" rx="10" fill="url(#glass-store)" stroke="rgba(240,180,41,0.660)" stroke-width="2.0"/><rect x="1434.5" y="232.46" width="426.5" height="105.47" rx="7" fill="none" stroke="rgba(240,180,41,0.320)" stroke-width="1"/><path d="M1441.5 230.36H1854.0" stroke="rgba(255,255,255,0.100)" stroke-width="1" fill="none"/><polygon points="1854.0,229.46 1864.0,229.46 1864.0,239.46" fill="#F0B429" opacity="0.9"/><path d="M1449.5 245.46h12l-1.6 10.5a1.4 1.4 0 0 1-1.4 1.2H1452.5 a1.4 1.4 0 0 1-1.4-1.2Z" fill="none" stroke="#F0B429" stroke-width="1.3"/><line x1="1448.5" y1="245.46" x2="1462.5" y2="245.46" stroke="#F0B429" stroke-width="1.3"/><text x="1469.5" y="256.6" font-size="16.0" font-weight="600" fill="#E8EEF6" letter-spacing="-0.1">MinIO</text><text x="1447.5" y="279.1" font-size="13.0" font-weight="400" fill="#9FB0C3">Immutable evidence</text><line x1="1447.5" y1="301.65" x2="1848.0" y2="301.65" stroke="#1C2736" stroke-width="1"/><text x="1447.5" y="315.6" font-size="12.0" font-weight="400" fill="#667B91" font-family='"JetBrains Mono", "Cascadia Code", Consolas, "SF Mono", Menlo, monospace'>Writers: Entity Producer (captures) · Preprocessor</text><text x="1447.5" y="331.8" font-size="12.0" font-weight="400" fill="#667B91" font-family='"JetBrains Mono", "Cascadia Code", Consolas, "SF Mono", Menlo, monospace'>(mirror)</text></g><text x="1431.5" y="366.9" font-size="12.0" font-weight="600" fill="#667B91" letter-spacing="1.4">HOLDS</text><circle cx="1435.5" cy="380.93" r="2" fill="rgba(240,180,41,0.850)"/><text x="1443.5" y="384.9" font-size="11.5" font-weight="400" fill="#9FB0C3">Captures under {eventId}/{filename}</text><circle cx="1435.5" cy="402.34000000000003" r="2" fill="rgba(240,180,41,0.850)"/><text x="1443.5" y="406.3" font-size="11.5" font-weight="400" fill="#9FB0C3">Evidence bucket with object lock</text><circle cx="1435.5" cy="423.75000000000006" r="2" fill="rgba(240,180,41,0.850)"/><text x="1443.5" y="427.8" font-size="11.5" font-weight="400" fill="#9FB0C3">Digest and size verified on read-back</text><circle cx="1435.5" cy="445.1600000000001" r="2" fill="rgba(240,180,41,0.850)"/><text x="1443.5" y="449.2" font-size="11.5" font-weight="400" fill="#9FB0C3">Mirror row written last, as the gate's evidence</text><circle cx="1435.5" cy="466.5700000000001" r="2" fill="rgba(240,180,41,0.850)"/><text x="1443.5" y="470.6" font-size="11.5" font-weight="400" fill="#9FB0C3">Never touched by withdrawal</text><g data-name="note"><rect x="1431.5" y="501.98000000000013" width="2.5" height="45.75" rx="1.2" fill="rgba(248,113,113,0.850)"/><text x="1445.5" y="514.0" font-size="12.0" font-weight="600" fill="rgba(248,113,113,0.950)" letter-spacing="1.4">CANNOT</text><text x="1445.5" y="534.0" font-size="12.5" font-weight="400" fill="#9FB0C3">Cannot be queried at all; it holds bytes and digests.</text></g><g data-name="note"><rect x="1431.5" y="563.7300000000001" width="2.5" height="63.5" rx="1.2" fill="rgba(52,211,153,0.850)"/><text x="1445.5" y="575.7" font-size="12.0" font-weight="600" fill="rgba(52,211,153,0.950)" letter-spacing="1.4">DESIGN CONSEQUENCE</text><text x="1445.5" y="595.7" font-size="12.5" font-weight="400" fill="#9FB0C3">Captures are immutable by key, not by policy — no versioning, no</text><text x="1445.5" y="613.5" font-size="12.5" font-weight="400" fill="#9FB0C3">content-addressing, no dedup.</text></g><g data-name="note"><rect x="56" y="663.2300000000001" width="2.5" height="63.5" rx="1.2" fill="rgba(129,140,248,0.850)"/><text x="70.0" y="675.2" font-size="12.0" font-weight="600" fill="rgba(129,140,248,0.950)" letter-spacing="1.4">THE MECHANISM THAT REPLACES A DISTRIBUTED TRANSACTION</text><text x="70.0" y="695.2" font-size="12.5" font-weight="400" fill="#9FB0C3">Every derived identifier is a pure function of PostgreSQL content: uuid5(namespace, chunk_id) for a Qdrant point, MERGE by id for a graph node, MERGE by code for a law node. Identity is derived, never generated — and that single property is what makes Kafka redelivery idempotent across two stores with no</text><text x="70.0" y="713.0" font-size="12.5" font-weight="400" fill="#9FB0C3">distributed transaction, and is the real answer to how the stores stay in step.</text></g><g data-name="legend"><text x="56.0" y="766.7" font-size="12.0" font-weight="600" fill="#667B91" letter-spacing="1.4">ROLE</text><circle cx="115" cy="762.7300000000001" r="4.6" fill="#F0B429" opacity="0.92"/><text x="125.0" y="766.7" font-size="12.0" font-weight="500" fill="#9FB0C3" letter-spacing="0.3">Persistence</text><text x="56.0" y="788.7" font-size="12.0" font-weight="600" fill="#667B91" letter-spacing="1.4">AUTHORSHIP</text><rect x="160" y="777.7300000000001" width="15" height="13" rx="3" fill="rgba(232,238,246,0.050)" stroke="#667B91" stroke-width="2.0"/><polygon points="168,777.7300000000001 175,777.7300000000001 175,784.7300000000001 " fill="#9FB0C3"/><text x="183.0" y="788.7" font-size="12.0" font-weight="500" fill="#9FB0C3" letter-spacing="0.3">Primary implementation</text></g></svg>